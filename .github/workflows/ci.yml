# Verifica di ogni PR. Il nome del job (ci) è il check richiesto dalla branch
# protection: tutti i passi devono essere verdi prima del merge.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Postgres vero per i test del backend e per gli e2e (modulo Nutrizione).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ron1nos
          POSTGRES_PASSWORD: ron1nos
          POSTGRES_DB: ron1nos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ron1nos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Report e2e
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Build immagine (senza push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

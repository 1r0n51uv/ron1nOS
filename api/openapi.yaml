# Contratto dell'API di ron1nOS, condiviso da dashboard web e app iOS.
# Le rotte sono versionate: un cambio incompatibile va sotto /api/v2.
openapi: 3.1.0
info:
  title: ron1nOS API
  version: 1.0.0
  description: >
    Backend della dashboard ron1nOS. Raggiungibile solo dalla tailnet. Con il
    login acceso (AUTH_PASSWORD_HASH) ogni rotta tranne `GET /health` e
    `POST /auth/login` chiede il cookie di sessione e senza risponde 401
    `unauthenticated`; le richieste che cambiano dati con un header Origin di
    un altro host rispondono 403 `forbidden_origin`. Le rotte di un modulo
    spento in Impostazioni (`/nutrition`, `/workout`, `/documents`,
    `/downloads`, `/server`) rispondono 404 `module_disabled` (SET-005).
servers:
  - url: /api/v1
security:
  - session: []
paths:
  /auth/login:
    post:
      summary: Entra con la password della dashboard (AUTH-001, AUTH-002)
      description: >
        Crea una sessione di 30 giorni, rinnovata a ogni uso, e la mette nel
        cookie `ron1nos_session` (HttpOnly, Secure, SameSite=Strict). Dopo 5
        password sbagliate in 15 minuti dallo stesso indirizzo risponde 429
        per 15 minuti (AUTH-004).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        "200":
          description: Sessione creata.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [enabled, expiresAt]
                properties:
                  enabled: { type: boolean, const: true }
                  expiresAt: { type: string, format: date-time }
        "401":
          description: "`invalid_password`: password non valida."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`auth_disabled`: login spento, AUTH_PASSWORD_HASH non impostato."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: "`too_many_attempts`: troppi tentativi, il messaggio dice quanto aspettare."
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /auth/logout:
    post:
      summary: Chiude la sessione di questo client
      operationId: logout
      responses:
        "204":
          description: Sessione chiusa e cookie tolto.
  /auth/me:
    get:
      summary: Stato del login
      description: >
        Con il login acceso risponde solo con una sessione valida (altrimenti
        401); con il login spento risponde `{ enabled: false }`.
      operationId: getMe
      responses:
        "200":
          description: Sessione valida, o login spento.
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /auth/sessions:
    get:
      summary: Sessioni attive (SET-007)
      description: >
        La più recente prima, con il dispositivo letto dallo user agent. L'id
        è ricavato dall'hash e non apre niente; i token non escono mai. Con il
        login spento l'elenco è vuoto.
      operationId: getSessions
      responses:
        "200":
          description: Le sessioni.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
    delete:
      summary: Esci ovunque
      description: Chiude tutte le sessioni, compresa questa.
      operationId: deleteSessions
      responses:
        "204":
          description: Sessioni chiuse e cookie tolto.
  /auth/sessions/others:
    delete:
      summary: Chiude le altre sessioni (SET-007)
      description: Resta aperta solo quella di questa richiesta.
      operationId: deleteOtherSessions
      responses:
        "204":
          description: Le altre sessioni sono chiuse.
  /auth/sessions/{id}:
    delete:
      summary: Chiude una sessione (SET-007)
      description: Se è quella di questa richiesta, toglie anche il cookie.
      operationId: deleteSession
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Sessione chiusa.
        "404": { $ref: "#/components/responses/NotFound" }
  /health:
    get:
      summary: Stato del backend
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Il backend risponde.
          content:
            application/json:
              schema:
                type: object
                required: [ok, database]
                properties:
                  ok: { type: boolean, const: true }
                  database:
                    type: string
                    enum: [disabled, starting, ok, unavailable]
                    description: >
                      Postgres del modulo Nutrizione. `disabled` senza DATABASE_URL,
                      `starting` mentre si applicano le migrazioni, `unavailable` se
                      all'avvio non risponde (il backend riprova da solo).
  /downloads:
    get:
      summary: Velocità totale e torrent di qBittorrent
      description: >
        Torrent ordinati per stato (downloading, queued, seeding, stopped, error)
        e, a parità di stato, dal più vicino alla fine.
      operationId: getDownloads
      responses:
        "200":
          description: Dati correnti di qBittorrent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Downloads" }
        "502":
          description: qBittorrent ha rifiutato le credenziali del backend.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: qBittorrent non raggiungibile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /downloads/drafts:
    post:
      summary: Crea una bozza del wizard Aggiungi
      description: >
        Legge un torrent senza darlo a qBittorrent. Accetta un file .torrent
        (multipart, campo `file`, fino a 10 MB) oppure un link in JSON: l'URL
        http(s) di un .torrent, scaricato dal server con le difese SSRF della
        specifica, o un magnet. Un magnet viene aggiunto a qBittorrent con il tag
        `ron1nos-draft`, fermo appena arrivano i metadati: la bozza parte in
        `metadata` e va riletta finché non diventa `ready` o `timeout`.
        Le bozze scadono dopo 30 minuti.
      operationId: createDraft
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
          application/json:
            schema:
              type: object
              required: [link]
              properties:
                link: { type: string, description: "magnet:?xt=urn:btih:… o https://…/file.torrent" }
      responses:
        "201":
          description: Bozza pronta, con i file del torrent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        "400":
          description: File non torrent (`invalid_torrent`) o link non valido (`invalid_link`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Il torrent è già in qBittorrent (`duplicate`); `torrent` dice quale.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: L'URL non è scaricabile o non contiene un torrent (`torrent_fetch_failed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /downloads/drafts/{id}/start:
    post:
      summary: Avvia il download con i file scelti
      description: >
        Con un .torrent lo aggiunge a qBittorrent solo ora, fermo, esclude i file
        non scelti e lo avvia; se qualcosa fallisce a metà il torrent viene tolto.
        Con un magnet esclude i file, toglie il tag delle bozze e lo avvia.
        La bozza è consumata.
      operationId: startDraft
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  items: { type: integer }
                  description: Indici dei file scelti (DraftFile.index).
      responses:
        "200":
          description: Download avviato.
          content:
            application/json:
              schema:
                type: object
                required: [hash]
                properties:
                  hash: { type: string }
        "400":
          description: Scelta vuota o con indici sconosciuti (`invalid_selection`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Bozza inesistente o scaduta (`draft_not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Spazio insufficiente (`insufficient_space`), con `needed` e `free`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: qBittorrent non ha accettato il torrent (`start_failed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /downloads/space:
    get:
      summary: Spazio libero nella cartella predefinita di qBittorrent
      operationId: getSpace
      responses:
        "200":
          description: Byte liberi e cartella.
          content:
            application/json:
              schema:
                type: object
                required: [free, path]
                properties:
                  free: { type: number, description: byte }
                  path: { type: string, description: "Cartella predefinita, es. /downloads." }
        "503":
          description: qBittorrent non raggiungibile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /downloads/drafts/{id}/retry:
    post:
      summary: Altri 60 secondi di attesa dei metadati di un magnet
      operationId: retryDraft
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: La bozza, di nuovo in `metadata`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        "404":
          description: Bozza inesistente o scaduta (`draft_not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /downloads/drafts/{id}:
    get:
      summary: Rilegge una bozza
      description: Con un magnet chiede a qBittorrent se i metadati sono arrivati.
      operationId: getDraft
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: La bozza.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        "404":
          description: Bozza inesistente o scaduta (`draft_not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Annulla una bozza
      description: >
        Una bozza da magnet esce da qBittorrent con i file eventualmente
        scaricati; le altre stavano solo in memoria. Le bozze rimaste (pagina
        chiusa, backend riavviato) il backend le toglie dopo 30 minuti.
      operationId: discardDraft
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Bozza tolta, o già assente.
  /documents/types:
    get:
      summary: Tipi di documento con i loro campi (DOC-003)
      description: >
        Prima i tipi già pronti, poi quelli creati dall'utente. Il modulo
        Documenti risponde 503 `documents_disabled` finché il login non è
        acceso e DOCUMENTS_KEY non è impostata.
      operationId: getDocumentTypes
      responses:
        "200":
          description: Tipi di documento.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DocumentType" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503":
          description: "`documents_disabled` o `database_unavailable`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      summary: Crea un tipo di documento (DOC-016)
      description: Le chiavi dei campi nuovi le genera il server dalle etichette.
      operationId: createDocumentType
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentTypeInput" }
      responses:
        "201":
          description: Tipo creato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentType" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/DocumentsUnavailable" }
  /documents/types/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Modifica un tipo, anche già pronto (DOC-016)
      description: >
        `fields` è l'elenco completo e ordinato: i campi esistenti si
        passano con la loro `key`, i nuovi senza. I valori dei campi tolti,
        o che non sono più date valide, diventano campi liberi sui
        documenti del tipo.
      operationId: updateDocumentType
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentTypeInput" }
      responses:
        "200":
          description: Tipo aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentType" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DocumentsUnavailable" }
    delete:
      summary: Elimina un tipo che nessun documento usa (DOC-016)
      operationId: deleteDocumentType
      responses:
        "204":
          description: Eliminato.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`type_in_use`: il messaggio dice quanti documenti lo usano."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DocumentsUnavailable" }
  /documents/holders:
    get:
      summary: Titolari già usati (DOC-007)
      description: I più frequenti per primi. Il titolare di default è `Io`.
      operationId: getDocumentHolders
      responses:
        "200":
          description: Nomi dei titolari.
          content:
            application/json:
              schema: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/DocumentsUnavailable" }
  /documents/documents:
    get:
      summary: Elenco dei documenti (DOC-002, DOC-008)
      description: >
        Prima i fissati, nell'ordine in cui sono stati fissati, poi gli
        altri per titolo. Solo dati in chiaro: nessun valore dei campi.
      operationId: listDocuments
      parameters:
        - name: q
          in: query
          description: Cerca nel titolo e nei tag.
          schema: { type: string, maxLength: 100 }
        - name: type
          in: query
          description: Id di un tipo, oppure `none` per i file senza tipo.
          schema: { type: string }
        - name: holder
          in: query
          schema: { type: string, maxLength: 60 }
      responses:
        "200":
          description: Documenti.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DocumentSummary" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/DocumentsUnavailable" }
    post:
      summary: Crea un documento (DOC-005)
      description: >
        Solo il titolo è obbligatorio. Con `typeId` i campi si validano
        contro il tipo; senza tipo il documento ha solo campi liberi.
      operationId: createDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentInput" }
      responses:
        "201":
          description: Documento creato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/DocumentsUnavailable" }
  /documents/documents/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Dettaglio di un documento (DOC-004)
      operationId: getDocument
      responses:
        "200":
          description: Documento con campi, tipo, scadenza e allegati.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DocumentsUnavailable" }
    patch:
      summary: Modifica un documento (DOC-003, DOC-005, DOC-008)
      description: >
        Solo i campi presenti cambiano. Cambiando `typeId` i valori che il
        nuovo tipo non ha diventano campi liberi. `pinned: true` su un
        documento già fissato non cambia il suo posto nell'evidenza.
      operationId: updateDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentPatch" }
      responses:
        "200":
          description: Documento aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DocumentsUnavailable" }
    delete:
      summary: Elimina un documento e i suoi allegati (DOC-014)
      operationId: deleteDocument
      responses:
        "204":
          description: Eliminato, in modo definitivo.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DocumentsUnavailable" }
  /documents/documents/{id}/summary.pdf:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: PDF di riepilogo (DOC-013)
      description: >
        A4 generato al volo e mai salvato sul server: titolo, titolare,
        scadenza, immagini allegate e campi; gli allegati PDF in coda, gli
        altri file elencati per nome. Il file scaricato è in chiaro.
      operationId: getDocumentSummary
      responses:
        "200":
          description: Il PDF, come allegato con il titolo del documento.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DocumentsUnavailable" }
  /documents/documents/{id}/files:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Carica un allegato (DOC-011)
      description: >
        Un file per richiesta, fino a 20 MB e 100 MB in tutto per
        documento. Il tipo si ricava dai byte; per le immagini il server
        genera una miniatura. Contenuto e miniatura sono cifrati.
      operationId: uploadDocumentFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                label: { $ref: "#/components/schemas/DocumentFileLabel" }
      responses:
        "201":
          description: Allegato caricato, in coda agli altri.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentFile" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`document_full`: oltre i 100 MB di allegati."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: "`file_too_large`: file oltre i 20 MB."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DocumentsUnavailable" }
  /documents/documents/{id}/files/{fileId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: fileId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Scarica un allegato o la sua miniatura (DOC-004, DOC-012)
      description: >
        Il file in chiaro con `Cache-Control: no-store`. Di default inline
        per l'anteprima; con `download=1` come allegato con il nome
        originale.
      operationId: getDocumentFile
      parameters:
        - name: variant
          in: query
          description: "`thumb`: miniatura JPEG, lato lungo 400 px."
          schema: { type: string, enum: [thumb] }
        - name: download
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: Contenuto del file.
          content:
            "*/*":
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DocumentsUnavailable" }
    patch:
      summary: Etichetta e ordine di un allegato (DOC-011)
      description: "`position` è l'indice nella lista: gli altri allegati scalano."
      operationId: updateDocumentFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { $ref: "#/components/schemas/DocumentFileLabel" }
                position: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Allegato aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentFile" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DocumentsUnavailable" }
    delete:
      summary: Elimina un allegato (DOC-014)
      operationId: deleteDocumentFile
      responses:
        "204":
          description: Eliminato, in modo definitivo.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DocumentsUnavailable" }
  /dashboard/layouts/{device}:
    parameters:
      - name: device
        in: path
        required: true
        schema: { type: string, enum: [desktop, iphone] }
    get:
      summary: Layout della dashboard di un dispositivo
      description: >
        Il layout salvato, o quello predefinito se non ce n'è (DASH-008).
        Senza database risponde comunque con il predefinito e `stored: false`.
      operationId: getDashboardLayout
      responses:
        "200":
          description: Il layout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardLayoutResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
    put:
      summary: Sostituisce il layout della dashboard di un dispositivo
      description: >
        Il backend controlla il layout contro il catalogo dei widget: id noti e
        non ripetuti, dimensioni nei limiti, dentro le 24 colonne, niente
        sovrapposizioni, varianti e opzioni dichiarate dal widget.
      operationId: putDashboardLayout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardLayout" }
      responses:
        "200":
          description: Il layout salvato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardLayoutResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "422":
          description: "`invalid_layout`: il layout non rispetta il catalogo; il messaggio dice perché."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    delete:
      summary: Ripristina il layout predefinito di un dispositivo
      description: >
        Cancella il layout salvato, opzioni dei widget comprese, e restituisce
        quello predefinito (DASH-008).
      operationId: deleteDashboardLayout
      responses:
        "200":
          description: Il layout predefinito, ora in uso.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardLayoutResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /integrations:
    get:
      summary: Stato dei servizi esterni (SET-009)
      description: >
        Postgres, YAZIO, qBittorrent, Glances e Home Assistant, con l'ora
        dell'ultimo controllo. Un controllo vale 30 secondi. Mai password,
        token, indirizzi o errori grezzi: i messaggi sono scritti dal backend.
      operationId: getIntegrations
      responses:
        "200":
          description: I servizi, sempre nello stesso ordine.
          content:
            application/json:
              schema:
                type: object
                required: [integrations]
                properties:
                  integrations:
                    type: array
                    items: { $ref: "#/components/schemas/Integration" }
  /integrations/{id}/check:
    post:
      summary: Rifà subito il controllo di un servizio
      description: Per YAZIO, se la sincronizzazione è accesa, fa anche un giro.
      operationId: checkIntegration
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, enum: [postgres, yazio, qbittorrent, glances, homeassistant] }
      responses:
        "200":
          description: Il servizio appena controllato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "404": { $ref: "#/components/responses/NotFound" }
  /preferences:
    get:
      summary: Preferenze di ron1nOS
      description: >
        Aspetto, moduli spenti, ordine della navigazione e formati (SET-002).
        Senza preferenze salvate valgono i predefiniti; senza database risponde
        con i predefiniti e `stored: false`.
      operationId: getPreferences
      responses:
        "200":
          description: Le preferenze.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreferencesResponse" }
    patch:
      summary: Modifica una parte delle preferenze
      description: >
        Ogni gruppo è facoltativo; in `appearance` e `formats` anche ogni campo.
        Campi sconosciuti o valori fuori elenco danno 400. `navOrder` deve
        contenere tutte le voci una sola volta. Lo sfondo `image` si può
        scegliere solo dopo aver caricato un'immagine.
      operationId: patchPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreferencesPatch" }
      responses:
        "200":
          description: Le preferenze dopo la modifica.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreferencesResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /preferences/background:
    put:
      summary: Carica l'immagine di sfondo e la mette in uso
      description: >
        Multipart, campo `file`: JPEG, PNG o WebP fino a 5 MB, riconosciuti dai
        primi byte (SET-003). Sostituisce quella di prima e imposta
        `appearance.background` a `image`.
      operationId: putPreferencesBackground
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Le preferenze con l'immagine in uso.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreferencesResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "413":
          description: "`file_too_large`: immagine oltre i 5 MB."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    get:
      summary: L'immagine di sfondo caricata
      operationId: getPreferencesBackground
      responses:
        "200":
          description: L'immagine, con il suo tipo.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    delete:
      summary: Toglie l'immagine di sfondo
      description: Se era in uso, torna lo sfondo predefinito.
      operationId: deletePreferencesBackground
      responses:
        "200":
          description: Le preferenze dopo la rimozione.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreferencesResponse" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /server/stats:
    get:
      summary: Risorse del server lette da Glances
      description: >
        CPU, RAM, disco di sistema, temperatura, uptime, rete e consumo dei
        container in esecuzione. Mai processi, righe di comando, IP o immagini.
      operationId: getServerStats
      responses:
        "200":
          description: Lettura corrente (in cache per 2 secondi).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerStats" }
        "503":
          description: Glances non raggiungibile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /nutrition/day:
    get:
      summary: Il giorno del diario, con i 5 pasti e i totali (NUT-001, NUT-002)
      operationId: getNutritionDay
      parameters:
        - { $ref: "#/components/parameters/NutritionDate" }
      responses:
        "200":
          description: Slot in ordine (colazione, spuntino, pranzo, merenda, cena), totali mangiati e obiettivo del giorno.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/meals:
    post:
      summary: Registra uno o più alimenti in un pasto di un giorno (NUT-003)
      description: >
        Ogni riga è un alimento del catalogo (`foodId`) o un risultato esterno
        della ricerca (`food`, i valori come in `Food`), che entra nel catalogo
        adesso. Kcal e macro vengono calcolati e copiati nella riga: correggere
        l'alimento dopo non cambia lo storico. Le righe si aggiungono in coda a
        quelle già registrate nello slot.
      operationId: logMeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, slot, items]
              properties:
                date: { type: string, format: date }
                slot: { $ref: "#/components/schemas/MealSlot" }
                items:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items:
                    oneOf:
                      - type: object
                        required: [foodId, grams]
                        properties:
                          foodId: { type: string, format: uuid }
                          grams: { $ref: "#/components/schemas/Grams" }
                      - type: object
                        required: [food, grams]
                        properties:
                          food:
                            type: object
                            description: Un risultato esterno di /nutrition/foods/search, senza `id`.
                            required: [source, externalId, name, kcal, protein, carbs, fat]
                            properties:
                              source: { type: string, enum: [openfoodfacts, usda, yazio] }
                              externalId: { type: string }
                              name: { type: string }
                              brand: { type: [string, "null"] }
                              barcode: { type: [string, "null"] }
                              servingSizeG: { type: [number, "null"] }
                              kcal: { type: number, minimum: 0, maximum: 900 }
                              protein: { type: number, minimum: 0, maximum: 100 }
                              carbs: { type: number, minimum: 0, maximum: 100 }
                              fat: { type: number, minimum: 0, maximum: 100 }
                              caffeineMg: { type: [number, "null"], minimum: 0 }
                              yazioProductId: { type: [string, "null"] }
                          grams: { $ref: "#/components/schemas/Grams" }
                      - type: object
                        description: Una ricetta intera (NUT-008), per `factor` porzioni.
                        required: [recipeId]
                        properties:
                          recipeId: { type: string, format: uuid }
                          factor: { type: number, minimum: 0.1, maximum: 10, default: 1 }
      responses:
        "201":
          description: Il giorno aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/meals/items/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Cambia i grammi di una riga di un pasto (NUT-007)
      description: >
        Kcal, macro e caffeina scalano dai valori copiati nella riga, non
        dall'alimento. Vale anche per i giorni passati.
      operationId: setMealItemGrams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grams]
              properties:
                grams: { $ref: "#/components/schemas/Grams" }
      responses:
        "200":
          description: Il giorno della riga, aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    delete:
      summary: Toglie una riga da un pasto (NUT-007)
      description: >
        Se era l'ultima il pasto sparisce, e il piano che aveva segnato torna
        `skipped` (ADR-0037).
      operationId: removeMealItem
      responses:
        "200":
          description: Il giorno della riga, aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/plans:
    put:
      summary: Pianifica un pasto su un giorno e uno slot (NUT-009)
      description: >
        Crea o sostituisce il piano del giorno e slot, nel passato o nel
        futuro. Le righe sono come in POST /nutrition/meals (alimenti o una
        ricetta); con una sola ricetta il piano la ricorda. Un piano saltato
        torna pianificato; uno mangiato non si cambia (409 `plan_eaten`).
      operationId: setPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, slot, items]
              properties:
                date: { type: string, format: date }
                slot: { $ref: "#/components/schemas/MealSlot" }
                items:
                  type: array
                  minItems: 1
                  maxItems: 30
                  description: Come `items` di POST /nutrition/meals.
                  items: { type: object }
      responses:
        "200":
          description: Il giorno aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`plan_eaten`: il pasto è già mangiato."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/plans/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Elimina un piano non ancora mangiato (NUT-009)
      operationId: deletePlan
      responses:
        "200":
          description: Il giorno aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`plan_eaten`: il pasto è già mangiato."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/plans/{id}/status:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: L'interruttore di un piano, mangiato o saltato (NUT-009)
      description: >
        `eaten` crea le righe del diario dagli alimenti del piano. Lasciare
        `eaten` (verso `planned` o `skipped`) cancella le righe create così,
        non quelle aggiunte a mano (ADR-0032).
      operationId: setPlanStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [planned, eaten, skipped] }
      responses:
        "200":
          description: Il giorno aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`plan_empty`: il piano non ha alimenti da registrare."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/templates:
    get:
      summary: Template settimanali (NUT-010)
      operationId: listTemplates
      responses:
        "200":
          description: I template con la griglia e le kcal di ogni giorno.
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items: { $ref: "#/components/schemas/Template" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    post:
      summary: Crea un template (NUT-010)
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInput" }
      responses:
        "201":
          description: Template creato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/templates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Sostituisce nome e griglia di un template (NUT-010)
      operationId: updateTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInput" }
      responses:
        "200":
          description: Template aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    delete:
      summary: Elimina un template (NUT-010)
      description: I pasti già pianificati restano, senza il collegamento al template.
      operationId: deleteTemplate
      responses:
        "204": { description: Eliminato. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/templates/{id}/apply:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Applica un template a una settimana (NUT-010)
      description: >
        Crea i pasti pianificati della settimana che inizia `monday`.
        Sostituisce solo quelli ancora pianificati; mangiati e saltati restano.
      operationId: applyTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monday]
              properties:
                monday: { type: string, format: date, description: Deve essere un lunedì. }
      responses:
        "200":
          description: Quanti pasti creati, sostituiti e lasciati com'erano.
          content:
            application/json:
              schema:
                type: object
                required: [created, replaced, kept]
                properties:
                  created: { type: integer }
                  replaced: { type: integer }
                  kept: { type: integer }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/water:
    post:
      summary: Aggiunge acqua al giorno (NUT-012)
      operationId: addWater
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
                ml: { type: number, exclusiveMinimum: 0, maximum: 5000, default: 250 }
      responses:
        "201":
          description: Il giorno aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/water/last:
    delete:
      summary: Annulla l'ultima acqua del giorno (NUT-012)
      description: >
        Toglie l'ultima voce registrata nel giorno, non una quantità fissa
        (ADR-0037). Senza voci il giorno resta com'è.
      operationId: undoWater
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: Il giorno aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/caffeine:
    post:
      summary: Aggiunge caffeina al giorno (NUT-013)
      operationId: addCaffeine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
                mg: { type: number, exclusiveMinimum: 0, maximum: 1000, default: 80 }
                source: { type: string, minLength: 1, maxLength: 80, default: Espresso }
      responses:
        "201":
          description: Il giorno aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/caffeine/last:
    delete:
      summary: Annulla l'ultima caffeina del giorno (NUT-013)
      description: >
        Toglie l'ultima voce del contatore (ADR-0037). La caffeina dei pasti
        si corregge dal diario.
      operationId: undoCaffeine
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: Il giorno aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/supplements:
    get:
      summary: Elenco degli integratori (NUT-014)
      operationId: listSupplements
      responses:
        "200":
          description: Prima gli attivi, poi i disattivati, in ordine di creazione.
          content:
            application/json:
              schema:
                type: object
                required: [supplements]
                properties:
                  supplements:
                    type: array
                    items: { $ref: "#/components/schemas/Supplement" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    post:
      summary: Aggiunge un integratore (NUT-014)
      operationId: createSupplement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplementInput" }
      responses:
        "201":
          description: L'integratore creato, attivo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplement" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/supplements/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Modifica, disattiva o riattiva un integratore (NUT-014)
      operationId: updateSupplement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplementPatch" }
      responses:
        "200":
          description: L'integratore aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplement" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    delete:
      summary: Elimina un integratore (NUT-014)
      description: Si cancellano anche le spunte dei giorni passati.
      operationId: deleteSupplement
      responses:
        "204": { description: Eliminato. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/supplements/{id}/taken:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Spunta un integratore in un giorno (NUT-014)
      operationId: setSupplementTaken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, taken]
              properties:
                date: { type: string, format: date }
                taken: { type: boolean }
      responses:
        "200":
          description: Il giorno aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/report:
    get:
      summary: Andamento (NUT-017)
      description: >
        Ultimi 30 o 90 giorni, oggi compreso: kcal e macro al giorno con la
        quota del giorno (NUT-016), media e macro sui giorni registrati,
        tendenza in kcal a settimana (retta dei giorni registrati, almeno
        4), aderenza (giorni entro ±150 kcal dall'obiettivo di quel giorno)
        e pesate nel periodo, quella di Salute se c'è.
      operationId: getReport
      parameters:
        - name: days
          in: query
          schema: { type: integer, enum: [30, 90], default: 30 }
      responses:
        "200":
          description: L'andamento.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionReport" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/yazio:
    get:
      summary: Stato del collegamento a YAZIO (NUT-020)
      description: >
        Le credenziali stanno solo nel .env del server: qui arrivano lo
        stato, il motivo di un errore e l'ora dell'ultimo giro riuscito.
      operationId: getYazioLink
      responses:
        "200":
          description: Lo stato del collegamento.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YazioLink" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/yazio/sync:
    put:
      summary: Accende o spegne la sincronizzazione con YAZIO (NUT-020)
      description: Spegnerla non cancella né i dati né i token.
      operationId: setYazioSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Lo stato aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YazioLink" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    post:
      summary: Sincronizza ora (NUT-020)
      description: >
        Un giro di sincronizzazione subito, lo stesso che il backend fa da
        solo ogni 15 minuti: obiettivo, energia attiva di oggi e di ieri,
        pesate nuove (al primo giro lo storico) e il diario degli ultimi 3
        giorni (NUT-022), poi l'invio delle righe nuove o cambiate, delle
        cancellazioni e dell'acqua (NUT-023), che il backend fa anche ogni
        minuto quando c'è qualcosa in coda. Le voci nuove di YAZIO entrano con `origin`
        `yazio`, quelle cancellate in YAZIO spariscono, una voce cambiata in
        YAZIO vince sulla riga di ron1nOS, l'acqua prende il totale di
        YAZIO. Un errore di YAZIO non dà un errore HTTP: finisce in `state`
        ed `error`.
      operationId: syncYazio
      responses:
        "200":
          description: Lo stato dopo il giro.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YazioLink" }
        "409":
          description: "`yazio_not_configured`: mancano le variabili YAZIO_*; `yazio_sync_off`: sincronizzazione spenta."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/yazio/unmatched:
    get:
      summary: Alimenti senza equivalente YAZIO (NUT-023)
      description: >
        Alimenti con righe che non sono partite verso YAZIO perché non c'è un
        prodotto equivalente. Esclusi quelli lasciati solo in ron1nOS.
      operationId: listUnmatched
      responses:
        "200":
          description: Gli alimenti, con quante righe e l'ultima volta che sono stati usati.
          content:
            application/json:
              schema:
                type: object
                required: [foods]
                properties:
                  foods: { type: array, items: { $ref: "#/components/schemas/Unmatched" } }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/yazio/products:
    get:
      summary: Cerca nel catalogo YAZIO per abbinare un alimento (NUT-023)
      operationId: searchYazioProducts
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Prodotti YAZIO venduti in Italia, come alimenti con `yazioProductId`.
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products: { type: array, items: { $ref: "#/components/schemas/Food" } }
        "409":
          description: "`yazio_not_configured`: mancano le variabili YAZIO_*."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`yazio_unreachable` o `database_unavailable`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /nutrition/foods/{id}/yazio:
    put:
      summary: Abbina un alimento a un prodotto YAZIO (NUT-023)
      description: >
        Con `productId` le righe dell'alimento tornano in coda e partono al
        prossimo invio; l'abbinamento vale anche dopo. Con `null` l'alimento
        resta solo in ron1nOS.
      operationId: setYazioEquivalent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: [string, "null"] }
      responses:
        "200":
          description: Gli alimenti ancora senza equivalente.
          content:
            application/json:
              schema:
                type: object
                required: [foods]
                properties:
                  foods: { type: array, items: { $ref: "#/components/schemas/Unmatched" } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/shopping:
    get:
      summary: Lista della spesa (NUT-011)
      operationId: listShopping
      responses:
        "200":
          description: Prima le voci dal piano, poi quelle a mano.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShoppingList" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    post:
      summary: Aggiunge una voce a mano (NUT-011)
      operationId: addShopping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                text:
                  { type: [string, "null"], maxLength: 50, description: "Quantità libera, es. `1 pacco`." }
      responses:
        "201":
          description: Voce aggiunta.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShoppingItem" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/shopping/generate:
    post:
      summary: Genera la lista dai pasti pianificati (NUT-011)
      description: >
        Somma i grammi dello stesso alimento nei pasti non saltati fra `from`
        e `to` (al massimo 31 giorni). Aggiunge solo ciò che manca: un
        alimento già in lista, per id o per nome, resta com'è.
      operationId: generateShopping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
      responses:
        "200":
          description: Quante voci aggiunte e la lista.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ShoppingList" }
                  - type: object
                    required: [added]
                    properties:
                      added: { type: integer }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/shopping/checked:
    delete:
      summary: Togli le spuntate (NUT-011)
      operationId: clearCheckedShopping
      responses:
        "200":
          description: Quante voci tolte e la lista.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ShoppingList" }
                  - type: object
                    required: [removed]
                    properties:
                      removed: { type: integer }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/shopping/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Spunta o modifica una voce (NUT-011)
      operationId: updateShopping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                checked: { type: boolean }
                name: { type: string, minLength: 1, maxLength: 200 }
                text: { type: [string, "null"], maxLength: 50 }
      responses:
        "200":
          description: Voce aggiornata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShoppingItem" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    delete:
      summary: Elimina una voce (NUT-011)
      operationId: deleteShopping
      responses:
        "204": { description: Eliminata. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/recipes:
    get:
      summary: Ricette, per nome (NUT-008)
      operationId: listRecipes
      responses:
        "200":
          description: Le ricette con alimenti e totali.
          content:
            application/json:
              schema:
                type: object
                required: [recipes]
                properties:
                  recipes:
                    type: array
                    items: { $ref: "#/components/schemas/Recipe" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    post:
      summary: Crea una ricetta (NUT-008)
      description: Un alimento esterno della ricerca entra nel catalogo adesso.
      operationId: createRecipe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeInput" }
      responses:
        "201":
          description: Ricetta creata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/recipes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Una ricetta (NUT-008)
      operationId: getRecipe
      responses:
        "200":
          description: La ricetta.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    put:
      summary: Sostituisce nome, note e alimenti di una ricetta (NUT-008)
      description: I pasti già registrati con la ricetta non cambiano.
      operationId: updateRecipe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeInput" }
      responses:
        "200":
          description: Ricetta aggiornata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    delete:
      summary: Elimina una ricetta (NUT-008)
      operationId: deleteRecipe
      responses:
        "204": { description: Eliminata. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/foods:
    get:
      summary: Alimenti personali, per nome (NUT-006)
      operationId: listCustomFoods
      responses:
        "200":
          description: Gli alimenti con `source` custom.
          content:
            application/json:
              schema:
                type: object
                required: [foods]
                properties:
                  foods:
                    type: array
                    items: { $ref: "#/components/schemas/Food" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    post:
      summary: Crea un alimento personale (NUT-006)
      description: Valori per 100 g. Marca, codice a barre, porzione e caffeina facoltativi; una stringa vuota vale null.
      operationId: createCustomFood
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomFoodInput" }
      responses:
        "201":
          description: Alimento creato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Food" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "409":
          description: "`barcode_exists`: il codice a barre è già di un altro alimento."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/foods/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Modifica un alimento personale (NUT-006)
      description: Cambiano solo i campi mandati. I pasti già registrati tengono i valori copiati.
      operationId: updateCustomFood
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomFoodPatch" }
      responses:
        "200":
          description: Alimento aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Food" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`food_not_custom` (alimento di un'altra fonte) o `barcode_exists`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    delete:
      summary: Elimina un alimento personale (NUT-006)
      description: I pasti già registrati restano, senza collegamento all'alimento.
      operationId: deleteCustomFood
      responses:
        "204": { description: Eliminato. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`food_not_custom`: si eliminano solo gli alimenti personali."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/foods/barcode/{code}:
    get:
      summary: Alimento da codice a barre (NUT-005)
      description: >
        Prima il catalogo locale, poi OpenFoodFacts. Un prodotto esterno ha
        `id` null ed entra nel catalogo solo quando si usa. `food` null: codice
        sconosciuto, o OpenFoodFacts giù se `unavailable` lo dice.
      operationId: findFoodByBarcode
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, pattern: "^\\d{6,14}$" } }
      responses:
        "200":
          description: L'alimento trovato, o null.
          content:
            application/json:
              schema:
                type: object
                required: [food, unavailable]
                properties:
                  food:
                    oneOf:
                      - { $ref: "#/components/schemas/Food" }
                      - { type: "null" }
                  unavailable:
                    type: array
                    items: { type: string, enum: [openfoodfacts] }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/foods/search:
    get:
      summary: Ricerca alimenti su catalogo locale, OpenFoodFacts, USDA e YAZIO (NUT-004, NUT-021)
      description: >
        Almeno 2 caratteri. Prima il catalogo locale (alimenti già usati o
        creati), poi OpenFoodFacts e USDA, poi i prodotti YAZIO venduti in
        Italia se YAZIO è collegato (con `yazioProductId`), senza doppioni
        per nome e marca.
        I risultati esterni hanno `id` null: entrano nel catalogo solo quando
        si usano. Una fonte che non risponde finisce in `unavailable`.
      operationId: searchFoods
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - name: italy
          in: query
          description: "`0` toglie il filtro Solo Italia di OpenFoodFacts, attivo di default."
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: Risultati, al massimo 30.
          content:
            application/json:
              schema:
                type: object
                required: [results, unavailable]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/Food" }
                  unavailable:
                    type: array
                    items: { type: string, enum: [openfoodfacts, usda, yazio] }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/goals:
    get:
      summary: Obiettivo nutrizionale valido in un giorno e storico (NUT-015)
      operationId: getNutritionGoals
      parameters:
        - { $ref: "#/components/parameters/NutritionDate" }
      responses:
        "200":
          description: >
            `current` è l'obiettivo valido nel giorno (null se non c'è), `history`
            le righe dalla più recente. `editable` è false quando l'obiettivo
            arriva da YAZIO.
          content:
            application/json:
              schema:
                type: object
                required: [current, history, editable]
                properties:
                  current:
                    oneOf:
                      - { $ref: "#/components/schemas/NutritionGoal" }
                      - { type: "null" }
                  history:
                    type: array
                    items: { $ref: "#/components/schemas/NutritionGoal" }
                  editable: { type: boolean }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    post:
      summary: Nuovo obiettivo manuale (solo senza YAZIO)
      description: >
        Aggiunge una riga allo storico, valida da `effectiveFrom` (di default
        oggi, Europe/Rome). I giorni precedenti tengono l'obiettivo che avevano.
      operationId: addNutritionGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kcal, protein, carbs, fat]
              properties:
                kcal: { type: number, minimum: 800, maximum: 8000 }
                protein: { type: number, minimum: 0, description: grammi }
                carbs: { type: number, minimum: 0, description: grammi }
                fat: { type: number, minimum: 0, description: grammi }
                waterMl: { type: [number, "null"], minimum: 0 }
                effectiveFrom: { type: string, format: date }
      responses:
        "201":
          description: Obiettivo salvato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionGoal" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "409":
          description: "`goals_from_yazio`: l'obiettivo arriva da YAZIO e si cambia lì."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /workout/import/preview:
    post:
      summary: Anteprima dell'import del CSV di Liftin' (GYM-003)
      description: >
        Legge il file come `POST /workout/import` e restituisce gli stessi
        conti, senza scrivere nulla. Il client non interpreta il CSV.
      operationId: previewWorkoutImport
      requestBody: { $ref: "#/components/requestBodies/LiftinCsv" }
      responses:
        "200":
          description: Cosa farebbe l'import.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutImportSummary" }
        "400": { $ref: "#/components/responses/LiftinInvalid" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /workout/import:
    post:
      summary: Importa il CSV di Liftin' (GYM-003)
      description: >
        Unisce il file allo storico. Una sessione è giorno (Europe/Rome) più
        routine; una serie è sessione, esercizio (senza maiuscole e spazi in
        più) e numero di serie. Le righe presenti si aggiornano, le nuove si
        aggiungono; un re-import identico non cambia nulla. Le sessioni
        eliminate non tornano.
      operationId: importWorkouts
      requestBody: { $ref: "#/components/requestBodies/LiftinCsv" }
      responses:
        "200":
          description: Import applicato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutImportSummary" }
        "400": { $ref: "#/components/responses/LiftinInvalid" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /workout/catalog:
    get:
      summary: Cerca nel catalogo delle immagini degli esercizi (GYM-014)
      description: >
        free-exercise-db (Unlicense), nomi in inglese. Ogni parola cercata
        deve iniziare una parola del nome; al massimo 60 risultati in ordine
        alfabetico. Il backend tiene una copia del catalogo nel volume.
      operationId: searchWorkoutCatalog
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Esercizi del catalogo.
          content:
            application/json:
              schema:
                type: object
                required: [exercises]
                properties:
                  exercises:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogExercise" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
  /workout/catalog/images/{id}/{file}:
    get:
      summary: Foto di un esercizio del catalogo (GYM-014)
      description: Servita dalla copia nel volume; non cambia mai per lo stesso id.
      operationId: getWorkoutCatalogImage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string, pattern: "^\\d\\.jpg$" } }
      responses:
        "200":
          description: La foto.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/CatalogUnavailable" }
  /workout/exercises:
    get:
      summary: Esercizi, con immagine e andamento (GYM-007, GYM-009)
      description: >
        Uno per nome normalizzato. Senza parametri dall'ultima volta più
        recente; `sort=sets` dai più allenati per numero di serie, come la
        dashboard esercizi con `limit=6`. `q` cerca nel nome.
      operationId: listWorkoutExercises
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, schema: { type: string, enum: [recent, sets], default: recent } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: Gli esercizi.
          content:
            application/json:
              schema:
                type: object
                required: [exercises]
                properties:
                  exercises:
                    type: array
                    items: { $ref: "#/components/schemas/WorkoutExercise" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /workout/exercises/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string, maxLength: 200 } }
    get:
      summary: Un esercizio, con grafici e ultime volte (GYM-008)
      description: >
        Il nome si normalizza (minuscole, spazi compressi). I tre numeri
        della testata sono su tutto lo storico; `points` è una voce per
        sessione nel periodo, `recent` le ultime 3 volte dalla più recente.
      operationId: getWorkoutExercise
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [3m, 6m, 1y, all], default: 6m } }
      responses:
        "200":
          description: L'esercizio.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutExerciseDetail" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /workout/exercises/{name}/image:
    put:
      summary: Sceglie a mano l'immagine di un esercizio (GYM-014)
      description: >
        Vale per il nome normalizzato (minuscole, spazi compressi), quindi
        per tutto lo storico, e sopravvive ai re-import. `catalogId` null
        torna all'abbinamento automatico: dizionario dei nomi italiani, poi
        un nome inglese uguale a uno del catalogo.
      operationId: setWorkoutExerciseImage
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [catalogId]
              properties:
                catalogId: { type: [string, "null"] }
      responses:
        "200":
          description: L'immagine ora in uso, con il gruppo dopo la proposta.
          content:
            application/json:
              schema:
                type: object
                required: [name, image, group]
                properties:
                  name: { type: string, description: nome normalizzato }
                  image: { $ref: "#/components/schemas/ExerciseImage" }
                  group:
                    description: >
                      Se l'esercizio non aveva un gruppo, quello dei muscoli
                      principali dell'immagine scelta (GYM-011).
                    oneOf:
                      - { $ref: "#/components/schemas/MuscleGroup" }
                      - { type: "null" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /workout/exercises/{name}/group:
    put:
      summary: Assegna il gruppo muscolare di un esercizio (GYM-011)
      description: >
        Vale per il nome normalizzato, quindi per tutto lo storico, e
        sopravvive ai re-import. `group` null lo toglie.
      operationId: setWorkoutExerciseGroup
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group]
              properties:
                group:
                  oneOf:
                    - { $ref: "#/components/schemas/MuscleGroup" }
                    - { type: "null" }
      responses:
        "200":
          description: Il gruppo ora assegnato.
          content:
            application/json:
              schema:
                type: object
                required: [name, group]
                properties:
                  name: { type: string, description: nome normalizzato }
                  group:
                    oneOf:
                      - { $ref: "#/components/schemas/MuscleGroup" }
                      - { type: "null" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /workout/summary:
    get:
      summary: Ultimo allenamento, settimana e giorni di fila (GYM-001, GYM-013)
      description: >
        Giorni locali Europe/Rome. `thisWeek` conta le sessioni da lunedì a
        oggi (due nello stesso giorno contano due); `streakDays` i giorni di
        calendario consecutivi con almeno una sessione che finiscono oggi o
        ieri. `weeks` sono le ultime 26 settimane, l'ultima è quella
        corrente. Le sessioni con un giorno dopo oggi non contano.
      operationId: getWorkoutSummary
      responses:
        "200":
          description: Il riepilogo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutSummary" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /workout/sessions:
    get:
      summary: Storico delle sessioni (GYM-004)
      description: >
        Dalla più recente, a pagine da 20. Ogni riga porta i primi tre
        esercizi nell'ordine del CSV, con la loro immagine (GYM-014).
      operationId: listWorkoutSessions
      parameters:
        - {
            name: routine,
            in: query,
            schema: { type: string },
            description: solo le sessioni di questa routine,
          }
        - {
            name: cursor,
            in: query,
            schema: { type: string },
            description: "`nextCursor` della pagina prima",
          }
      responses:
        "200":
          description: Una pagina di sessioni.
          content:
            application/json:
              schema:
                type: object
                required: [sessions, nextCursor]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/WorkoutSessionRow" }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /workout/routines:
    get:
      summary: Nomi delle routine per il filtro dello storico (GYM-004)
      description: Dalla routine usata più di recente; senza le sessioni senza routine.
      operationId: listWorkoutRoutines
      responses:
        "200":
          description: I nomi.
          content:
            application/json:
              schema:
                type: object
                required: [routines]
                properties:
                  routines: { type: array, items: { type: string } }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /workout/sessions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Dettaglio di una sessione (GYM-005)
      description: >
        Esercizi nell'ordine del CSV con le serie. Volume senza
        riscaldamento; `record` quando il miglior 1RM stimato della sessione
        supera quello di tutte le sessioni precedenti (GYM-010).
      operationId: getWorkoutSession
      responses:
        "200":
          description: La sessione.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutSessionDetail" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    delete:
      summary: Elimina una sessione (GYM-006)
      description: >
        Unica modifica sui dati importati. Il server ricorda giorno e
        routine, così un nuovo import del CSV non la riporta.
      operationId: deleteWorkoutSession
      responses:
        "204": { description: Eliminata. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ron1nos_session
      description: Cookie di sessione creato da `POST /auth/login`.
  parameters:
    NutritionDate:
      name: date
      in: query
      description: Giorno locale Europe/Rome; di default oggi.
      schema: { type: string, format: date }
  requestBodies:
    LiftinCsv:
      required: true
      description: >
        Il CSV esportato da Liftin' (`Date;Duration;Routine;Exercise;Set;Warmup;Weight;Reps/Time;Goal;Perception`,
        separatore `;`), al massimo 5 MB.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file: { type: string, format: binary }
  responses:
    CatalogUnavailable:
      description: "`catalog_unavailable`: la copia del catalogo non c'è e non si riesce a scaricarla."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    LiftinInvalid:
      description: >
        `invalid_request`: file assente, vuoto, oltre i 5 MB, senza le colonne
        Date, Exercise o Set (il messaggio le elenca) o senza righe valide.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: "`unauthenticated`: serve il login."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidRequest:
      description: "`invalid_request`: richiesta non valida, il messaggio dice quale campo."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`not_found`: risorsa inesistente."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    DatabaseUnavailable:
      description: "`database_unavailable`: Postgres non raggiungibile."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    DocumentsUnavailable:
      description: "`documents_disabled` (manca il login o DOCUMENTS_KEY) o `database_unavailable`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    DocumentTypeField:
      type: object
      required: [key, label, kind, copyable]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{0,39}$" }
        label: { type: string, maxLength: 60 }
        kind: { type: string, enum: [text, date, code] }
        copyable: { type: boolean }
    DocumentTypeInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        icon: { type: string, enum: [id-card, passport, car, health, file, card, person] }
        fields:
          type: array
          maxItems: 40
          items:
            type: object
            required: [label, kind, copyable]
            properties:
              key: { type: string, description: Solo per i campi già esistenti. }
              label: { type: string, maxLength: 60 }
              kind: { type: string, enum: [text, date, code] }
              copyable: { type: boolean }
    DocumentType:
      type: object
      required: [id, key, name, icon, preset, fields, documents]
      properties:
        id: { type: string, format: uuid }
        key:
          type: [string, "null"]
          description: Chiave stabile dei tipi già pronti (identity_card…), null per quelli creati.
        name: { type: string }
        icon: { type: string }
        preset: { type: boolean }
        fields:
          type: array
          items: { $ref: "#/components/schemas/DocumentTypeField" }
        documents: { type: integer, description: Documenti di questo tipo. }
    WorkoutImportSummary:
      type: object
      required:
        [
          newSessions,
          updatedSessions,
          unchangedSessions,
          deletedSessions,
          newSets,
          updatedSets,
          skippedRows,
          from,
          to,
        ]
      properties:
        newSessions: { type: integer, description: allenamenti nuovi }
        updatedSessions: { type: integer, description: allenamenti già presenti con serie o durata cambiate }
        unchangedSessions: { type: integer }
        deletedSessions: { type: integer, description: allenamenti eliminati in ron1nOS, lasciati fuori }
        newSets: { type: integer }
        updatedSets: { type: integer }
        skippedRows: { type: integer, description: righe senza data valida o esercizio }
        from: { type: string, format: date, description: primo giorno nel file }
        to: { type: string, format: date, description: ultimo giorno nel file }
    MuscleGroup:
      type: string
      description: Gruppo muscolare dall'elenco fisso (GYM-011).
      enum: [petto, schiena, spalle, bicipiti, tricipiti, gambe, glutei, addome, altro]
    ExerciseImage:
      type: [object, "null"]
      description: >
        Foto dell'esercizio dal catalogo (GYM-014): scelta a mano, dal
        dizionario dei nomi italiani o dallo stesso nome inglese; null se
        nessuna.
      required: [catalogId, source, url]
      properties:
        catalogId: { type: string }
        source: { type: string, enum: [manual, dictionary, catalog] }
        url: { type: string, description: indirizzo della prima foto sotto /api/v1/workout/catalog/images }
    CatalogExercise:
      type: object
      required: [id, name, primaryMuscles, equipment, images, url]
      properties:
        id: { type: string }
        name: { type: string, description: nome inglese }
        primaryMuscles: { type: array, items: { type: string } }
        equipment: { type: [string, "null"] }
        images: { type: integer, description: numero di foto }
        url: { type: string }
    WorkoutExerciseRef:
      type: object
      required: [name, image]
      properties:
        name: { type: string }
        image: { $ref: "#/components/schemas/ExerciseImage" }
    WorkoutSummary:
      type: object
      required: [today, last, thisWeek, streakDays, weeks]
      properties:
        today: { type: string, format: date, description: oggi a Roma }
        last:
          type: [object, "null"]
          required: [id, day, routine, startedAt, durationSeconds, exercise]
          properties:
            id: { type: string, format: uuid }
            day: { type: string, format: date }
            routine: { type: string }
            startedAt: { type: string, format: date-time }
            durationSeconds: { type: [integer, "null"] }
            exercise:
              description: il primo esercizio della sessione
              oneOf:
                - { $ref: "#/components/schemas/WorkoutExerciseRef" }
                - { type: "null" }
        thisWeek: { type: integer, description: sessioni da lunedì a oggi }
        streakDays: { type: integer, description: giorni di fila fino a oggi o ieri }
        weeks:
          type: array
          description: ultime 26 settimane, dalla meno recente
          items:
            type: object
            required: [monday, count]
            properties:
              monday: { type: string, format: date }
              count: { type: integer }
    WorkoutSessionRow:
      type: object
      required: [id, day, routine, startedAt, durationSeconds, exercises]
      properties:
        id: { type: string, format: uuid }
        day: { type: string, format: date }
        routine: { type: string }
        startedAt: { type: string, format: date-time }
        durationSeconds: { type: [integer, "null"] }
        exercises:
          type: array
          description: i primi tre esercizi nell'ordine del CSV
          items: { $ref: "#/components/schemas/WorkoutExerciseRef" }
    WorkoutSessionDetail:
      type: object
      required: [id, day, routine, startedAt, durationSeconds, volumeKg, exercises]
      properties:
        id: { type: string, format: uuid }
        day: { type: string, format: date }
        routine: { type: string }
        startedAt: { type: string, format: date-time }
        durationSeconds: { type: [integer, "null"] }
        volumeKg: { type: number, description: senza riscaldamento }
        exercises:
          type: array
          items:
            type: object
            required: [name, key, image, timed, volumeKg, record, sets]
            properties:
              name: { type: string }
              key: { type: string, description: nome normalizzato }
              image: { $ref: "#/components/schemas/ExerciseImage" }
              timed: { type: boolean }
              volumeKg: { type: number }
              record: { type: boolean, description: miglior 1RM stimato rispetto alle sessioni precedenti }
              sets:
                type: array
                items:
                  type: object
                  required: [index, warmup, weightKg, reps, durationSeconds]
                  properties:
                    index: { type: integer }
                    warmup: { type: boolean }
                    weightKg: { type: number }
                    reps: { type: [integer, "null"] }
                    durationSeconds: { type: [integer, "null"] }
    WorkoutExercise:
      type: object
      required:
        [name, key, image, group, timed, sets, sessions, lastDay, best1RMKg, bestDurationSeconds, trend]
      properties:
        name: { type: string, description: come scritto nell'ultima sessione }
        key: { type: string, description: nome normalizzato }
        image: { $ref: "#/components/schemas/ExerciseImage" }
        group:
          type: [string, "null"]
          enum: [petto, schiena, spalle, bicipiti, tricipiti, gambe, glutei, addome, altro, null]
        timed: { type: boolean }
        sets: { type: integer, description: serie fuori dal riscaldamento }
        sessions: { type: integer }
        lastDay: { type: string, format: date }
        best1RMKg:
          { type: [number, "null"], description: miglior 1RM stimato (Epley); null per gli esercizi a tempo }
        bestDurationSeconds:
          { type: [integer, "null"], description: durata più lunga, solo per gli esercizi a tempo }
        trend:
          type: array
          description: il migliore di ogni sessione (1RM o durata), ultime 12, dalla meno recente
          items: { type: number }
    WorkoutExerciseDetail:
      type: object
      required:
        [
          name,
          key,
          image,
          group,
          timed,
          best1RMKg,
          heaviestKg,
          bestDurationSeconds,
          sessions,
          range,
          points,
          recent,
        ]
      properties:
        name: { type: string }
        key: { type: string }
        image: { $ref: "#/components/schemas/ExerciseImage" }
        group: { type: [string, "null"] }
        timed: { type: boolean }
        best1RMKg: { type: [number, "null"], description: su tutto lo storico; null per gli esercizi a tempo }
        heaviestKg: { type: [number, "null"], description: peso più alto in una serie valida }
        bestDurationSeconds: { type: [integer, "null"], description: solo per gli esercizi a tempo }
        sessions: { type: integer }
        range: { type: string, enum: [3m, 6m, 1y, all] }
        points:
          type: array
          description: una voce per sessione nel periodo, dalla meno recente
          items:
            type: object
            required: [sessionId, day, best1RMKg, volumeKg, bestDurationSeconds, totalDurationSeconds]
            properties:
              sessionId: { type: string, format: uuid }
              day: { type: string, format: date }
              best1RMKg: { type: number }
              volumeKg: { type: number }
              bestDurationSeconds: { type: integer }
              totalDurationSeconds: { type: integer }
        recent:
          type: array
          description: le ultime 3 volte, dalla più recente
          items:
            type: object
            required: [sessionId, day, best1RMKg, sets]
            properties:
              sessionId: { type: string, format: uuid }
              day: { type: string, format: date }
              best1RMKg: { type: [number, "null"] }
              sets:
                type: array
                items:
                  type: object
                  required: [warmup, weightKg, reps, durationSeconds]
                  properties:
                    warmup: { type: boolean }
                    weightKg: { type: number }
                    reps: { type: [integer, "null"] }
                    durationSeconds: { type: [integer, "null"] }
    DocumentExpiry:
      type: [object, "null"]
      description: >
        Stato della scadenza (DOC-010): `expiring` dal primo preavviso
        attivo, `expired` dal giorno dopo la scadenza. null senza data.
      required: [status, daysLeft]
      properties:
        status: { type: string, enum: [ok, expiring, expired] }
        daysLeft: { type: integer }
    DocumentExtraField:
      type: object
      required: [label, value]
      properties:
        label: { type: string, minLength: 1, maxLength: 60 }
        value: { type: string, minLength: 1, maxLength: 2000 }
    DocumentFileLabel:
      type: string
      enum: [fronte, retro, pagina, altro]
    DocumentFile:
      type: object
      required: [id, name, mime, size, label, position, hasThumb, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: Nome originale. }
        mime: { type: string, description: Ricavato dai byte; `application/octet-stream` se sconosciuto. }
        size: { type: integer }
        label: { $ref: "#/components/schemas/DocumentFileLabel" }
        position: { type: integer }
        hasThumb: { type: boolean }
        createdAt: { type: string, format: date-time }
    DocumentSummary:
      type: object
      required:
        [
          id,
          typeId,
          typeName,
          typeIcon,
          title,
          holder,
          expiresOn,
          expiry,
          tags,
          pinnedAt,
          files,
          thumbFileId,
          firstFile,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        typeId: { type: [string, "null"], format: uuid }
        typeName: { type: [string, "null"] }
        typeIcon: { type: [string, "null"] }
        title: { type: string }
        holder: { type: string }
        expiresOn: { type: [string, "null"], format: date }
        expiry: { $ref: "#/components/schemas/DocumentExpiry" }
        tags: { type: array, items: { type: string } }
        pinnedAt: { type: [string, "null"], format: date-time }
        files: { type: integer, description: Numero di allegati. }
        thumbFileId:
          type: [string, "null"]
          format: uuid
          description: Primo allegato, se è un'immagine con miniatura.
        firstFile:
          type: [object, "null"]
          description: Tipo e dimensione del primo allegato.
          required: [mime, size]
          properties:
            mime: { type: string }
            size: { type: integer }
        updatedAt: { type: string, format: date-time }
    Document:
      type: object
      required:
        [
          id,
          typeId,
          type,
          title,
          holder,
          expiresOn,
          expiry,
          warnings,
          tags,
          pinnedAt,
          fields,
          extra,
          notes,
          files,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        typeId: { type: [string, "null"], format: uuid }
        type:
          type: [object, "null"]
          required: [id, name, icon, fields]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            icon: { type: string }
            fields:
              type: array
              items: { $ref: "#/components/schemas/DocumentTypeField" }
        title: { type: string }
        holder: { type: string }
        expiresOn: { type: [string, "null"], format: date }
        expiry: { $ref: "#/components/schemas/DocumentExpiry" }
        warnings: { type: array, items: { type: integer, enum: [90, 30, 7] } }
        tags: { type: array, items: { type: string } }
        pinnedAt: { type: [string, "null"], format: date-time }
        fields:
          type: object
          additionalProperties: { type: string }
          description: Valori dei campi del tipo, per chiave.
        extra:
          type: array
          items: { $ref: "#/components/schemas/DocumentExtraField" }
        notes: { type: string }
        files:
          type: array
          items: { $ref: "#/components/schemas/DocumentFile" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DocumentPatch:
      type: object
      properties:
        typeId: { type: [string, "null"], format: uuid }
        title: { type: string, minLength: 1, maxLength: 120 }
        holder: { type: string, minLength: 1, maxLength: 60 }
        expiresOn: { type: [string, "null"], format: date }
        warnings:
          type: array
          items: { type: integer, enum: [90, 30, 7] }
        tags:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 40 }
        pinned: { type: boolean }
        fields:
          type: object
          additionalProperties: { type: string, maxLength: 2000 }
        extra:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/DocumentExtraField" }
        notes: { type: string, maxLength: 5000 }
    DocumentInput:
      allOf:
        - { $ref: "#/components/schemas/DocumentPatch" }
        - type: object
          required: [title]
          description: >
            Di default titolare `Io`, preavvisi 90, 30 e 7 giorni, nessun
            tipo, non fissato.
    Food:
      type: object
      description: Alimento, valori per 100 g. `id` null per un candidato esterno non ancora nel catalogo.
      required:
        [
          id,
          source,
          externalId,
          name,
          brand,
          barcode,
          servingSizeG,
          kcal,
          protein,
          carbs,
          fat,
          caffeineMg,
          yazioProductId,
        ]
      properties:
        id: { type: [string, "null"], format: uuid }
        source: { type: string, enum: [custom, openfoodfacts, usda, yazio] }
        externalId: { type: [string, "null"] }
        name: { type: string }
        brand: { type: [string, "null"] }
        barcode: { type: [string, "null"] }
        servingSizeG: { type: [number, "null"] }
        kcal: { type: number }
        protein: { type: number }
        carbs: { type: number }
        fat: { type: number }
        caffeineMg: { type: [number, "null"] }
        yazioProductId: { type: [string, "null"] }
    CustomFoodInput:
      type: object
      description: Alimento personale, valori per 100 g.
      required: [name, kcal, protein, carbs, fat]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        brand: { type: [string, "null"], maxLength: 200 }
        barcode: { type: [string, "null"], pattern: "^\\d{6,14}$" }
        servingSizeG: { type: [number, "null"], minimum: 0, maximum: 10000 }
        kcal: { type: number, minimum: 0, maximum: 900 }
        protein: { type: number, minimum: 0, maximum: 100 }
        carbs: { type: number, minimum: 0, maximum: 100 }
        fat: { type: number, minimum: 0, maximum: 100 }
        caffeineMg: { type: [number, "null"], minimum: 0 }
    Unmatched:
      type: object
      required: [food, rows, last]
      properties:
        food:
          type: object
          required: [id, name, brand, source, kcal]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            brand: { type: [string, "null"] }
            source: { type: string, enum: [custom, openfoodfacts, usda, yazio] }
            kcal: { type: number, description: kcal per 100 g }
        rows: { type: integer }
        last:
          type: object
          required: [day, slot, grams]
          properties:
            day: { type: string, format: date }
            slot: { $ref: "#/components/schemas/MealSlot" }
            grams: { type: number }
    YazioLink:
      type: object
      required: [configured, state, error, lastSyncAt, syncEnabled, queue, unmatched, imported]
      properties:
        configured:
          { type: boolean, description: "false se mancano le variabili YAZIO_* nel .env del server" }
        state: { type: string, enum: [connected, disconnected, error] }
        error: { type: [string, "null"], description: Il motivo dell'errore, in italiano }
        lastSyncAt: { type: [string, "null"], format: date-time, description: Ultimo giro riuscito }
        syncEnabled: { type: boolean }
        queue: { type: integer, description: Righe e cancellazioni in coda verso YAZIO (NUT-023) }
        unmatched: { type: integer, description: Alimenti senza equivalente YAZIO }
        imported:
          type: object
          description: Quello che arriva da YAZIO (NUT-024); si modifica solo nell'app YAZIO.
          required: [goal, activityKcal, weight]
          properties:
            goal:
              description: L'obiettivo di oggi, se arriva da YAZIO.
              oneOf:
                - { $ref: "#/components/schemas/NutritionGoal" }
                - { type: "null" }
            activityKcal: { type: [number, "null"], description: Energia attiva di oggi }
            weight:
              description: Il peso di riferimento, l'ultima pesata.
              oneOf:
                - type: object
                  required: [day, kg]
                  properties:
                    day: { type: string, format: date }
                    kg: { type: number }
                - { type: "null" }
    NutritionReport:
      type: object
      required: [days, from, to, series, averageKcal, trendKcalPerWeek, adherence, macros, goal, weight]
      properties:
        days: { type: integer }
        from: { type: string, format: date }
        to: { type: string, format: date }
        series:
          type: array
          items:
            type: object
            required: [date, kcal, protein, carbs, fat, logged, goalKcal]
            properties:
              date: { type: string, format: date }
              kcal: { type: number }
              protein: { type: number }
              carbs: { type: number }
              fat: { type: number }
              logged: { type: boolean, description: almeno una riga quel giorno }
              goalKcal: { type: [number, "null"], description: la quota del giorno }
        averageKcal: { type: [number, "null"] }
        trendKcalPerWeek: { type: [number, "null"] }
        adherence:
          type: object
          required: [inTarget, total, pct]
          properties:
            inTarget: { type: integer }
            total: { type: integer, description: giorni registrati con un obiettivo }
            pct: { type: [integer, "null"] }
        macros:
          oneOf:
            - type: object
              required: [protein, carbs, fat]
              properties:
                protein: { type: number }
                carbs: { type: number }
                fat: { type: number }
            - { type: "null" }
        goal:
          description: Macro dell'obiettivo di oggi.
          oneOf:
            - type: object
              required: [protein, carbs, fat]
              properties:
                protein: { type: number }
                carbs: { type: number }
                fat: { type: number }
            - { type: "null" }
        weight:
          type: object
          required: [points, first, last, delta]
          properties:
            points:
              type: array
              items:
                type: object
                required: [date, kg]
                properties:
                  date: { type: string, format: date }
                  kg: { type: number }
            first: { type: [number, "null"] }
            last: { type: [number, "null"] }
            delta: { type: [number, "null"] }
    Supplement:
      type: object
      required: [id, name, dose, schedule, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        dose: { type: [string, "null"], description: Testo libero, per esempio 5 g. }
        schedule: { type: [string, "null"], description: Quando, per esempio mattina. }
        active: { type: boolean }
    SupplementInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        dose: { type: [string, "null"], maxLength: 80, description: Vuota diventa null. }
        schedule: { type: [string, "null"], maxLength: 80, description: Vuoto diventa null. }
    SupplementPatch:
      type: object
      description: I campi assenti restano com'erano.
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        dose: { type: [string, "null"], maxLength: 80 }
        schedule: { type: [string, "null"], maxLength: 80 }
        active: { type: boolean }
    CustomFoodPatch:
      type: object
      description: I campi di CustomFoodInput da cambiare, tutti facoltativi.
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        brand: { type: [string, "null"], maxLength: 200 }
        barcode: { type: [string, "null"], pattern: "^\\d{6,14}$" }
        servingSizeG: { type: [number, "null"], minimum: 0, maximum: 10000 }
        kcal: { type: number, minimum: 0, maximum: 900 }
        protein: { type: number, minimum: 0, maximum: 100 }
        carbs: { type: number, minimum: 0, maximum: 100 }
        fat: { type: number, minimum: 0, maximum: 100 }
        caffeineMg: { type: [number, "null"], minimum: 0 }
    ShoppingItem:
      type: object
      required: [id, foodId, name, grams, text, checked, source]
      properties:
        id: { type: string, format: uuid }
        foodId: { type: [string, "null"], format: uuid }
        name: { type: string }
        grams: { type: [number, "null"], description: Solo per le voci dal piano. }
        text: { type: [string, "null"], description: Quantità libera delle voci a mano. }
        checked: { type: boolean }
        source: { type: string, enum: [generated, manual] }
    ShoppingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ShoppingItem" }
    Template:
      type: object
      required: [id, name, cells, dayKcal]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        cells:
          type: array
          items:
            type: object
            required: [weekday, slot, recipeId, foodId, grams, name, kcal]
            properties:
              weekday: { type: integer, minimum: 1, maximum: 7, description: 1 è lunedì }
              slot: { $ref: "#/components/schemas/MealSlot" }
              recipeId: { type: [string, "null"], format: uuid }
              foodId: { type: [string, "null"], format: uuid }
              grams: { type: [number, "null"] }
              name: { type: string }
              kcal: { type: number }
        dayKcal:
          type: array
          minItems: 7
          maxItems: 7
          items: { type: number }
    TemplateInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        cells:
          type: array
          maxItems: 35
          description: Una voce per giorno e slot, con una ricetta o un alimento (mai entrambi).
          items:
            type: object
            required: [weekday, slot]
            properties:
              weekday: { type: integer, minimum: 1, maximum: 7 }
              slot: { $ref: "#/components/schemas/MealSlot" }
              recipeId: { type: string, format: uuid }
              foodId: { type: string, format: uuid }
              food: { type: object, description: Un risultato esterno della ricerca, entra nel catalogo. }
              grams: { $ref: "#/components/schemas/Grams" }
    Recipe:
      allOf:
        - { $ref: "#/components/schemas/Macros" }
        - type: object
          description: Kcal e macro dagli alimenti di oggi.
          required: [id, name, notes, grams, items]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            notes: { type: [string, "null"] }
            grams: { type: number, description: peso totale degli alimenti }
            items:
              type: array
              items:
                allOf:
                  - { $ref: "#/components/schemas/Macros" }
                  - type: object
                    required: [id, foodId, name, grams, missing]
                    properties:
                      id: { type: string, format: uuid }
                      foodId: { type: [string, "null"], format: uuid }
                      name: { type: string }
                      grams: { type: number }
                      missing:
                        { type: boolean, description: "L'alimento è stato eliminato: la riga non conta." }
    RecipeInput:
      type: object
      required: [name, items]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        notes: { type: [string, "null"], maxLength: 2000, description: Una stringa vuota vale null. }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            description: "`foodId` di un alimento del catalogo o `food`, un risultato esterno come in POST /nutrition/meals."
            required: [grams]
            properties:
              foodId: { type: string, format: uuid }
              food: { type: object }
              grams: { $ref: "#/components/schemas/Grams" }
    Grams:
      type: number
      exclusiveMinimum: 0
      maximum: 10000
    Macros:
      type: object
      required: [kcal, protein, carbs, fat]
      properties:
        kcal: { type: number, description: kcal intere }
        protein: { type: number, description: grammi, un decimale }
        carbs: { type: number }
        fat: { type: number }
    MealSlot:
      type: string
      enum: [breakfast, morning_snack, lunch, afternoon_snack, dinner]
    NutritionDay:
      type: object
      required:
        [
          date,
          goal,
          quota,
          totals,
          plannedKcal,
          slots,
          suggestedSlot,
          nextSlot,
          waterMl,
          caffeine,
          supplements,
        ]
      properties:
        date: { type: string, format: date }
        goal:
          oneOf:
            - type: object
              required: [kcal, protein, carbs, fat, waterMl]
              properties:
                kcal: { type: number }
                protein: { type: number }
                carbs: { type: number }
                fat: { type: number }
                waterMl: { type: [number, "null"] }
            - { type: "null" }
        quota:
          description: >
            Le kcal del giorno (NUT-016): obiettivo di base più l'energia
            attiva letta da YAZIO, al massimo +1200 kcal. null senza
            obiettivo.
          oneOf:
            - type: object
              required: [kcal, baseKcal, activityKcal]
              properties:
                kcal: { type: number }
                baseKcal: { type: number }
                activityKcal: { type: number }
            - { type: "null" }
        totals: { $ref: "#/components/schemas/Macros" }
        plannedKcal: { type: number, description: kcal pianificate e non ancora mangiate }
        slots:
          type: array
          items: { $ref: "#/components/schemas/NutritionSlot" }
        suggestedSlot:
          description: Lo slot dell'ora corrente, solo per oggi; null negli altri giorni.
          oneOf:
            - { $ref: "#/components/schemas/MealSlot" }
            - { type: "null" }
        nextSlot:
          description: >
            Solo per oggi, il prossimo pasto da segnare: dallo slot dell'ora in
            poi, il primo vuoto o pianificato. null se sono tutti segnati e
            negli altri giorni.
          oneOf:
            - { $ref: "#/components/schemas/MealSlot" }
            - { type: "null" }
        waterMl: { type: integer, minimum: 0, description: Acqua bevuta nel giorno (NUT-012). }
        caffeine:
          description: >
            Caffeina del giorno (NUT-013): le voci del contatore più gli
            alimenti registrati che ne hanno.
          type: object
          required: [totalMg, mealsMg]
          properties:
            totalMg: { type: integer, minimum: 0 }
            mealsMg: { type: integer, minimum: 0, description: La parte dai pasti. }
        supplements:
          description: >
            La checklist degli integratori (NUT-014): gli attivi più quelli
            presi quel giorno.
          type: array
          items:
            type: object
            required: [id, name, dose, schedule, taken]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              dose: { type: [string, "null"] }
              schedule: { type: [string, "null"] }
              taken: { type: boolean }
    NutritionSlot:
      type: object
      required: [slot, state, meal, planned]
      properties:
        slot: { $ref: "#/components/schemas/MealSlot" }
        state: { type: string, enum: [empty, planned, eaten, skipped] }
        meal:
          oneOf:
            - allOf:
                - { $ref: "#/components/schemas/Macros" }
                - type: object
                  required: [id, items]
                  properties:
                    id: { type: string, format: uuid }
                    items:
                      type: array
                      items: { $ref: "#/components/schemas/MealItem" }
            - { type: "null" }
        planned:
          oneOf:
            - allOf:
                - { $ref: "#/components/schemas/Macros" }
                - type: object
                  required: [id, status, recipeId, recipeName, templateName, items]
                  properties:
                    id: { type: string, format: uuid }
                    status: { type: string, enum: [planned, eaten, skipped] }
                    recipeId: { type: [string, "null"] }
                    recipeName: { type: [string, "null"] }
                    templateName: { type: [string, "null"] }
                    items:
                      type: array
                      items:
                        allOf:
                          - { $ref: "#/components/schemas/Macros" }
                          - type: object
                            required: [foodId, name, grams]
                            properties:
                              foodId: { type: [string, "null"] }
                              name: { type: string }
                              grams: { type: number }
            - { type: "null" }
    MealItem:
      description: Riga del diario, con kcal e macro copiati alla registrazione.
      allOf:
        - { $ref: "#/components/schemas/Macros" }
        - type: object
          required: [id, foodId, name, grams, origin, sync]
          properties:
            id: { type: string, format: uuid, description: anche l'id della voce in YAZIO }
            foodId: { type: [string, "null"] }
            name: { type: string }
            grams: { type: number }
            origin: { type: string, enum: [ron1nos, yazio] }
            sync:
              type: string
              enum: [local, pending, synced, error, unmatched]
              description: >
                Stato verso YAZIO (NUT-023): `local` resta solo in ron1nOS,
                `pending` in coda, `synced` inviata, `error` rifiutata da
                YAZIO (si riprova al giro completo), `unmatched` senza
                equivalente.
    NutritionGoal:
      type: object
      required: [id, source, kcal, protein, carbs, fat, waterMl, effectiveFrom]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [manual, yazio] }
        kcal: { type: number }
        protein: { type: number, description: grammi }
        carbs: { type: number, description: grammi }
        fat: { type: number, description: grammi }
        waterMl: { type: [number, "null"] }
        effectiveFrom: { type: string, format: date }
    Draft:
      type: object
      required: [id, source, status, infoHash, name, size, files]
      properties:
        id: { type: string }
        source: { type: string, enum: [file, url, magnet] }
        status:
          type: string
          enum: [ready, metadata, timeout]
          description: >
            ready: file noti. metadata: magnet in attesa dei peer. timeout: attesa
            finita senza metadati, si può chiamare retry.
        infoHash: { type: string, description: Infohash v1, o v2 troncato a 40 caratteri. }
        name: { type: string }
        size: { type: number, description: Byte totali del torrent. }
        files:
          type: array
          items: { $ref: "#/components/schemas/DraftFile" }
        metadata:
          type: object
          description: Solo per i magnet in metadata o timeout.
          required: [peers, waitedSeconds, limitSeconds]
          properties:
            peers: { type: integer }
            waitedSeconds: { type: integer }
            limitSeconds: { type: integer }
    DraftFile:
      type: object
      required: [index, path, size]
      properties:
        index: { type: integer, description: Indice del file per qBittorrent. }
        path: { type: string, description: Percorso con la cartella del torrent, separato da /. }
        size: { type: number, description: byte }
    ServerStats:
      type: object
      required: [cpu, ram, disk, uptimeSec]
      properties:
        cpu: { type: number, description: Uso totale della CPU in percentuale. }
        ram: { type: number, description: Memoria usata in percentuale, senza cache. }
        disk: { type: number, description: Spazio occupato sul disco di sistema in percentuale. }
        tempC: { type: number, description: Temperatura della CPU in °C; assente senza sensore. }
        uptimeSec: { type: integer, description: Secondi da quando il server è acceso. }
        net:
          type: object
          description: Interfacce fisiche; assente se Glances non la fornisce.
          required: [rxBps, txBps]
          properties:
            rxBps: { type: number, description: byte/s in ingresso }
            txBps: { type: number, description: byte/s in uscita }
        containers:
          type: array
          description: Solo i container in esecuzione; assente senza socket Docker.
          items: { $ref: "#/components/schemas/ContainerUsage" }
    ContainerUsage:
      type: object
      required: [name, cpu, memBytes]
      properties:
        name: { type: string }
        cpu: { type: number, description: Percentuale di un core, può superare 100. }
        memBytes: { type: number }
    Downloads:
      type: object
      required: [downloadSpeed, torrents]
      properties:
        downloadSpeed: { type: number, description: Velocità totale di download in byte/s. }
        torrents:
          type: array
          items: { $ref: "#/components/schemas/Torrent" }
    Torrent:
      type: object
      required: [hash, name, progress, state, etaSeconds, downloadSpeed, size]
      properties:
        hash: { type: string, description: Infohash. }
        name: { type: string }
        progress: { type: number, minimum: 0, maximum: 1 }
        state:
          type: string
          enum: [downloading, queued, seeding, stopped, error]
        etaSeconds:
          type: [integer, "null"]
          description: Secondi alla fine; null se non stimabile.
        downloadSpeed: { type: number, description: byte/s }
        size: { type: number, description: Byte selezionati per il download. }
    DashboardLayoutItem:
      type: object
      description: Un widget nella griglia di 24 colonne, righe da 24px.
      required: [id, x, y, w, h]
      properties:
        id: { type: string, description: "Id del catalogo, `<modulo>.<nome>`." }
        x: { type: integer, minimum: 0 }
        y: { type: integer, minimum: 0 }
        w: { type: integer, minimum: 1, maximum: 24 }
        h: { type: integer, minimum: 1 }
        variant: { type: string, enum: [compact, detailed] }
        options:
          type: object
          additionalProperties: true
          description: >-
            Dati mostrati, solo le chiavi che il widget dichiara nel catalogo
            (`server/dashboard/catalog.ts`): una scelta, più valori o un numero
            di elementi. Le chiavi assenti valgono il predefinito.
    DashboardLayout:
      type: object
      required: [header, items]
      properties:
        header: { type: string, enum: [full, line, hidden] }
        items:
          type: array
          maxItems: 60
          items: { $ref: "#/components/schemas/DashboardLayoutItem" }
    DashboardLayoutResponse:
      allOf:
        - $ref: "#/components/schemas/DashboardLayout"
        - type: object
          required: [device, updatedAt, stored]
          properties:
            device: { type: string, enum: [desktop, iphone] }
            updatedAt: { type: [string, "null"], format: date-time }
            stored: { type: boolean, description: "false senza database: le modifiche non si salvano." }
    Session:
      type: object
      required: [id, device, createdAt, lastSeenAt, current]
      properties:
        id: { type: string }
        device: { type: string, description: "Es. Safari su iPhone." }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        current: { type: boolean, description: "La sessione di questa richiesta." }
    Integration:
      type: object
      required: [id, name, state, message, checkedAt, env]
      properties:
        id: { type: string, enum: [postgres, yazio, qbittorrent, glances, homeassistant] }
        name: { type: string }
        state: { type: string, enum: [connected, error, not_configured] }
        message: { type: [string, "null"], description: "Il motivo dell'errore, in italiano." }
        checkedAt: { type: string, format: date-time }
        env:
          type: array
          items: { type: string }
          description: Le variabili del `.env` da impostare, solo per un servizio non configurato.
    PreferencesAppearance:
      type: object
      additionalProperties: false
      properties:
        background: { type: string, enum: [brace, nebbia, grafite, nero, image] }
        glass: { type: string, enum: [light, medium, strong] }
        density: { type: string, enum: [comfortable, compact] }
    PreferencesFormats:
      type: object
      additionalProperties: false
      properties:
        timeZone: { type: string, description: "Fuso IANA, es. Europe/Rome." }
        weightUnit: { type: string, enum: [kg, lb] }
        energyUnit: { type: string, enum: [kcal, kJ] }
    PreferencesNavOrder:
      type: array
      description: Tutte le voci spostabili della barra, una volta ciascuna.
      items: { type: string, enum: [pasti, allenamenti, documenti, note, casa, server] }
      uniqueItems: true
      minItems: 6
      maxItems: 6
    PreferencesDisabledModules:
      type: array
      items:
        type: string
        enum: [nutrition, workout, weight, home, server, containers, downloads, notes, documents]
      uniqueItems: true
    Preferences:
      type: object
      required: [appearance, disabledModules, navOrder, formats]
      properties:
        appearance:
          allOf:
            - $ref: "#/components/schemas/PreferencesAppearance"
            - required: [background, glass, density]
        disabledModules: { $ref: "#/components/schemas/PreferencesDisabledModules" }
        navOrder: { $ref: "#/components/schemas/PreferencesNavOrder" }
        formats:
          allOf:
            - $ref: "#/components/schemas/PreferencesFormats"
            - required: [timeZone, weightUnit, energyUnit]
    PreferencesPatch:
      type: object
      additionalProperties: false
      properties:
        appearance: { $ref: "#/components/schemas/PreferencesAppearance" }
        disabledModules: { $ref: "#/components/schemas/PreferencesDisabledModules" }
        navOrder: { $ref: "#/components/schemas/PreferencesNavOrder" }
        formats: { $ref: "#/components/schemas/PreferencesFormats" }
    PreferencesResponse:
      allOf:
        - $ref: "#/components/schemas/Preferences"
        - type: object
          required: [updatedAt, backgroundImage, stored]
          properties:
            updatedAt: { type: [string, "null"], format: date-time }
            backgroundImage:
              type: [string, "null"]
              format: date-time
              description: >-
                Quando è stata caricata l'immagine di sfondo, o null se non c'è.
                Va nell'indirizzo dell'immagine (`?v=`) per non usare quella vecchia.
            stored: { type: boolean, description: "false senza database: le modifiche non si salvano." }
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum:
            - qbittorrent_unreachable
            - qbittorrent_auth
            - invalid_torrent
            - invalid_link
            - torrent_fetch_failed
            - draft_not_found
            - duplicate
            - invalid_selection
            - insufficient_space
            - start_failed
            - glances_unreachable
            - database_unavailable
            - invalid_request
            - invalid_layout
            - module_disabled
            - goals_from_yazio
            - barcode_exists
            - food_not_custom
            - plan_eaten
            - plan_empty
            - not_found
            - internal
        message: { type: string, description: Messaggio in italiano da mostrare. }
        torrent:
          type: object
          description: Solo con `duplicate`, il torrent già presente.
          properties:
            name: { type: string }
            state: { type: string, enum: [downloading, queued, seeding, stopped, error] }
        needed: { type: number, description: Solo con `insufficient_space`, byte da scaricare. }
        free: { type: number, description: Solo con `insufficient_space`, byte liberi. }

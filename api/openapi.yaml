# Contratto dell'API di ron1nOS, condiviso da dashboard web e app iOS.
# Le rotte sono versionate: un cambio incompatibile va sotto /api/v2.
openapi: 3.1.0
info:
  title: ron1nOS API
  version: 1.0.0
  description: Backend della dashboard ron1nOS. Raggiungibile solo dalla tailnet.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Stato del backend
      operationId: getHealth
      responses:
        "200":
          description: Il backend risponde.
          content:
            application/json:
              schema:
                type: object
                required: [ok, database]
                properties:
                  ok: { type: boolean, const: true }
                  database:
                    type: string
                    enum: [disabled, starting, ok, unavailable]
                    description: >
                      Postgres del modulo Nutrizione. `disabled` senza DATABASE_URL,
                      `starting` mentre si applicano le migrazioni, `unavailable` se
                      all'avvio non risponde (il backend riprova da solo).
  /downloads:
    get:
      summary: Velocità totale e torrent di qBittorrent
      description: >
        Torrent ordinati per stato (downloading, queued, seeding, stopped, error)
        e, a parità di stato, dal più vicino alla fine.
      operationId: getDownloads
      responses:
        "200":
          description: Dati correnti di qBittorrent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Downloads" }
        "502":
          description: qBittorrent ha rifiutato le credenziali del backend.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: qBittorrent non raggiungibile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /downloads/drafts:
    post:
      summary: Crea una bozza del wizard Aggiungi
      description: >
        Legge un torrent senza darlo a qBittorrent. Accetta un file .torrent
        (multipart, campo `file`, fino a 10 MB) oppure un link in JSON: l'URL
        http(s) di un .torrent, scaricato dal server con le difese SSRF della
        specifica, o un magnet. Un magnet viene aggiunto a qBittorrent con il tag
        `ron1nos-draft`, fermo appena arrivano i metadati: la bozza parte in
        `metadata` e va riletta finché non diventa `ready` o `timeout`.
        Le bozze scadono dopo 30 minuti.
      operationId: createDraft
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
          application/json:
            schema:
              type: object
              required: [link]
              properties:
                link: { type: string, description: "magnet:?xt=urn:btih:… o https://…/file.torrent" }
      responses:
        "201":
          description: Bozza pronta, con i file del torrent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        "400":
          description: File non torrent (`invalid_torrent`) o link non valido (`invalid_link`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Il torrent è già in qBittorrent (`duplicate`); `torrent` dice quale.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: L'URL non è scaricabile o non contiene un torrent (`torrent_fetch_failed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /downloads/drafts/{id}/start:
    post:
      summary: Avvia il download con i file scelti
      description: >
        Con un .torrent lo aggiunge a qBittorrent solo ora, fermo, esclude i file
        non scelti e lo avvia; se qualcosa fallisce a metà il torrent viene tolto.
        Con un magnet esclude i file, toglie il tag delle bozze e lo avvia.
        La bozza è consumata.
      operationId: startDraft
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  items: { type: integer }
                  description: Indici dei file scelti (DraftFile.index).
      responses:
        "200":
          description: Download avviato.
          content:
            application/json:
              schema:
                type: object
                required: [hash]
                properties:
                  hash: { type: string }
        "400":
          description: Scelta vuota o con indici sconosciuti (`invalid_selection`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Bozza inesistente o scaduta (`draft_not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Spazio insufficiente (`insufficient_space`), con `needed` e `free`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: qBittorrent non ha accettato il torrent (`start_failed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /downloads/space:
    get:
      summary: Spazio libero nella cartella predefinita di qBittorrent
      operationId: getSpace
      responses:
        "200":
          description: Byte liberi e cartella.
          content:
            application/json:
              schema:
                type: object
                required: [free, path]
                properties:
                  free: { type: number, description: byte }
                  path: { type: string, description: "Cartella predefinita, es. /downloads." }
        "503":
          description: qBittorrent non raggiungibile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /downloads/drafts/{id}/retry:
    post:
      summary: Altri 60 secondi di attesa dei metadati di un magnet
      operationId: retryDraft
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: La bozza, di nuovo in `metadata`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        "404":
          description: Bozza inesistente o scaduta (`draft_not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /downloads/drafts/{id}:
    get:
      summary: Rilegge una bozza
      description: Con un magnet chiede a qBittorrent se i metadati sono arrivati.
      operationId: getDraft
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: La bozza.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        "404":
          description: Bozza inesistente o scaduta (`draft_not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Annulla una bozza
      description: >
        Una bozza da magnet esce da qBittorrent con i file eventualmente
        scaricati; le altre stavano solo in memoria. Le bozze rimaste (pagina
        chiusa, backend riavviato) il backend le toglie dopo 30 minuti.
      operationId: discardDraft
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Bozza tolta, o già assente.
  /server/stats:
    get:
      summary: Risorse del server lette da Glances
      description: >
        CPU, RAM, disco di sistema, temperatura, uptime, rete e consumo dei
        container in esecuzione. Mai processi, righe di comando, IP o immagini.
      operationId: getServerStats
      responses:
        "200":
          description: Lettura corrente (in cache per 2 secondi).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerStats" }
        "503":
          description: Glances non raggiungibile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /nutrition/day:
    get:
      summary: Il giorno del diario, con i 5 pasti e i totali (NUT-001, NUT-002)
      operationId: getNutritionDay
      parameters:
        - { $ref: "#/components/parameters/NutritionDate" }
      responses:
        "200":
          description: Slot in ordine (colazione, spuntino, pranzo, merenda, cena), totali mangiati e obiettivo del giorno.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/meals:
    post:
      summary: Registra uno o più alimenti in un pasto di un giorno (NUT-003)
      description: >
        Ogni riga è un alimento del catalogo (`foodId`) o un risultato esterno
        della ricerca (`food`, i valori come in `Food`), che entra nel catalogo
        adesso. Kcal e macro vengono calcolati e copiati nella riga: correggere
        l'alimento dopo non cambia lo storico. Le righe si aggiungono in coda a
        quelle già registrate nello slot.
      operationId: logMeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, slot, items]
              properties:
                date: { type: string, format: date }
                slot: { $ref: "#/components/schemas/MealSlot" }
                items:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items:
                    oneOf:
                      - type: object
                        required: [foodId, grams]
                        properties:
                          foodId: { type: string, format: uuid }
                          grams: { $ref: "#/components/schemas/Grams" }
                      - type: object
                        required: [food, grams]
                        properties:
                          food:
                            type: object
                            description: Un risultato esterno di /nutrition/foods/search, senza `id`.
                            required: [source, externalId, name, kcal, protein, carbs, fat]
                            properties:
                              source: { type: string, enum: [openfoodfacts, usda, yazio] }
                              externalId: { type: string }
                              name: { type: string }
                              brand: { type: [string, "null"] }
                              barcode: { type: [string, "null"] }
                              servingSizeG: { type: [number, "null"] }
                              kcal: { type: number, minimum: 0, maximum: 900 }
                              protein: { type: number, minimum: 0, maximum: 100 }
                              carbs: { type: number, minimum: 0, maximum: 100 }
                              fat: { type: number, minimum: 0, maximum: 100 }
                              caffeineMg: { type: [number, "null"], minimum: 0 }
                              yazioProductId: { type: [string, "null"] }
                          grams: { $ref: "#/components/schemas/Grams" }
                      - type: object
                        description: Una ricetta intera (NUT-008), per `factor` porzioni.
                        required: [recipeId]
                        properties:
                          recipeId: { type: string, format: uuid }
                          factor: { type: number, minimum: 0.1, maximum: 10, default: 1 }
      responses:
        "201":
          description: Il giorno aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/meals/items/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Cambia i grammi di una riga di un pasto (NUT-007)
      description: >
        Kcal, macro e caffeina scalano dai valori copiati nella riga, non
        dall'alimento. Vale anche per i giorni passati.
      operationId: setMealItemGrams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grams]
              properties:
                grams: { $ref: "#/components/schemas/Grams" }
      responses:
        "200":
          description: Il giorno della riga, aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    delete:
      summary: Toglie una riga da un pasto (NUT-007)
      description: >
        Se era l'ultima il pasto sparisce, e il piano che aveva segnato torna
        `skipped` (ADR-0037).
      operationId: removeMealItem
      responses:
        "200":
          description: Il giorno della riga, aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/plans:
    put:
      summary: Pianifica un pasto su un giorno e uno slot (NUT-009)
      description: >
        Crea o sostituisce il piano del giorno e slot, nel passato o nel
        futuro. Le righe sono come in POST /nutrition/meals (alimenti o una
        ricetta); con una sola ricetta il piano la ricorda. Un piano saltato
        torna pianificato; uno mangiato non si cambia (409 `plan_eaten`).
      operationId: setPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, slot, items]
              properties:
                date: { type: string, format: date }
                slot: { $ref: "#/components/schemas/MealSlot" }
                items:
                  type: array
                  minItems: 1
                  maxItems: 30
                  description: Come `items` di POST /nutrition/meals.
                  items: { type: object }
      responses:
        "200":
          description: Il giorno aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`plan_eaten`: il pasto è già mangiato."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/plans/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Elimina un piano non ancora mangiato (NUT-009)
      operationId: deletePlan
      responses:
        "200":
          description: Il giorno aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`plan_eaten`: il pasto è già mangiato."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/plans/{id}/status:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: L'interruttore di un piano, mangiato o saltato (NUT-009)
      description: >
        `eaten` crea le righe del diario dagli alimenti del piano. Lasciare
        `eaten` (verso `planned` o `skipped`) cancella le righe create così,
        non quelle aggiunte a mano (ADR-0032).
      operationId: setPlanStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [planned, eaten, skipped] }
      responses:
        "200":
          description: Il giorno aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`plan_empty`: il piano non ha alimenti da registrare."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/templates:
    get:
      summary: Template settimanali (NUT-010)
      operationId: listTemplates
      responses:
        "200":
          description: I template con la griglia e le kcal di ogni giorno.
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items: { $ref: "#/components/schemas/Template" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    post:
      summary: Crea un template (NUT-010)
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInput" }
      responses:
        "201":
          description: Template creato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/templates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Sostituisce nome e griglia di un template (NUT-010)
      operationId: updateTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInput" }
      responses:
        "200":
          description: Template aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    delete:
      summary: Elimina un template (NUT-010)
      description: I pasti già pianificati restano, senza il collegamento al template.
      operationId: deleteTemplate
      responses:
        "204": { description: Eliminato. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/templates/{id}/apply:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Applica un template a una settimana (NUT-010)
      description: >
        Crea i pasti pianificati della settimana che inizia `monday`.
        Sostituisce solo quelli ancora pianificati; mangiati e saltati restano.
      operationId: applyTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monday]
              properties:
                monday: { type: string, format: date, description: Deve essere un lunedì. }
      responses:
        "200":
          description: Quanti pasti creati, sostituiti e lasciati com'erano.
          content:
            application/json:
              schema:
                type: object
                required: [created, replaced, kept]
                properties:
                  created: { type: integer }
                  replaced: { type: integer }
                  kept: { type: integer }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/water:
    post:
      summary: Aggiunge acqua al giorno (NUT-012)
      operationId: addWater
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
                ml: { type: number, exclusiveMinimum: 0, maximum: 5000, default: 250 }
      responses:
        "201":
          description: Il giorno aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/water/last:
    delete:
      summary: Annulla l'ultima acqua del giorno (NUT-012)
      description: >
        Toglie l'ultima voce registrata nel giorno, non una quantità fissa
        (ADR-0037). Senza voci il giorno resta com'è.
      operationId: undoWater
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: Il giorno aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/caffeine:
    post:
      summary: Aggiunge caffeina al giorno (NUT-013)
      operationId: addCaffeine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
                mg: { type: number, exclusiveMinimum: 0, maximum: 1000, default: 80 }
                source: { type: string, minLength: 1, maxLength: 80, default: Espresso }
      responses:
        "201":
          description: Il giorno aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/caffeine/last:
    delete:
      summary: Annulla l'ultima caffeina del giorno (NUT-013)
      description: >
        Toglie l'ultima voce del contatore (ADR-0037). La caffeina dei pasti
        si corregge dal diario.
      operationId: undoCaffeine
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: Il giorno aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/supplements:
    get:
      summary: Elenco degli integratori (NUT-014)
      operationId: listSupplements
      responses:
        "200":
          description: Prima gli attivi, poi i disattivati, in ordine di creazione.
          content:
            application/json:
              schema:
                type: object
                required: [supplements]
                properties:
                  supplements:
                    type: array
                    items: { $ref: "#/components/schemas/Supplement" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    post:
      summary: Aggiunge un integratore (NUT-014)
      operationId: createSupplement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplementInput" }
      responses:
        "201":
          description: L'integratore creato, attivo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplement" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/supplements/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Modifica, disattiva o riattiva un integratore (NUT-014)
      operationId: updateSupplement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplementPatch" }
      responses:
        "200":
          description: L'integratore aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplement" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    delete:
      summary: Elimina un integratore (NUT-014)
      description: Si cancellano anche le spunte dei giorni passati.
      operationId: deleteSupplement
      responses:
        "204": { description: Eliminato. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/supplements/{id}/taken:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Spunta un integratore in un giorno (NUT-014)
      operationId: setSupplementTaken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, taken]
              properties:
                date: { type: string, format: date }
                taken: { type: boolean }
      responses:
        "200":
          description: Il giorno aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionDay" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/yazio:
    get:
      summary: Stato del collegamento a YAZIO (NUT-020)
      description: >
        Le credenziali stanno solo nel .env del server: qui arrivano lo
        stato, il motivo di un errore e l'ora dell'ultimo giro riuscito.
      operationId: getYazioLink
      responses:
        "200":
          description: Lo stato del collegamento.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YazioLink" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/yazio/sync:
    put:
      summary: Accende o spegne la sincronizzazione con YAZIO (NUT-020)
      description: Spegnerla non cancella né i dati né i token.
      operationId: setYazioSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Lo stato aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YazioLink" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    post:
      summary: Sincronizza ora (NUT-020)
      description: >
        Un giro di sincronizzazione subito: obiettivo, energia attiva di
        oggi e di ieri, pesate nuove (al primo giro lo storico). Un errore
        di YAZIO non dà un errore HTTP: finisce in `state` ed `error`.
      operationId: syncYazio
      responses:
        "200":
          description: Lo stato dopo il giro.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YazioLink" }
        "409":
          description: "`yazio_not_configured`: mancano le variabili YAZIO_*; `yazio_sync_off`: sincronizzazione spenta."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/shopping:
    get:
      summary: Lista della spesa (NUT-011)
      operationId: listShopping
      responses:
        "200":
          description: Prima le voci dal piano, poi quelle a mano.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShoppingList" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    post:
      summary: Aggiunge una voce a mano (NUT-011)
      operationId: addShopping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                text:
                  { type: [string, "null"], maxLength: 50, description: "Quantità libera, es. `1 pacco`." }
      responses:
        "201":
          description: Voce aggiunta.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShoppingItem" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/shopping/generate:
    post:
      summary: Genera la lista dai pasti pianificati (NUT-011)
      description: >
        Somma i grammi dello stesso alimento nei pasti non saltati fra `from`
        e `to` (al massimo 31 giorni). Aggiunge solo ciò che manca: un
        alimento già in lista, per id o per nome, resta com'è.
      operationId: generateShopping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
      responses:
        "200":
          description: Quante voci aggiunte e la lista.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ShoppingList" }
                  - type: object
                    required: [added]
                    properties:
                      added: { type: integer }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/shopping/checked:
    delete:
      summary: Togli le spuntate (NUT-011)
      operationId: clearCheckedShopping
      responses:
        "200":
          description: Quante voci tolte e la lista.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ShoppingList" }
                  - type: object
                    required: [removed]
                    properties:
                      removed: { type: integer }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/shopping/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Spunta o modifica una voce (NUT-011)
      operationId: updateShopping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                checked: { type: boolean }
                name: { type: string, minLength: 1, maxLength: 200 }
                text: { type: [string, "null"], maxLength: 50 }
      responses:
        "200":
          description: Voce aggiornata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShoppingItem" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    delete:
      summary: Elimina una voce (NUT-011)
      operationId: deleteShopping
      responses:
        "204": { description: Eliminata. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/recipes:
    get:
      summary: Ricette, per nome (NUT-008)
      operationId: listRecipes
      responses:
        "200":
          description: Le ricette con alimenti e totali.
          content:
            application/json:
              schema:
                type: object
                required: [recipes]
                properties:
                  recipes:
                    type: array
                    items: { $ref: "#/components/schemas/Recipe" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    post:
      summary: Crea una ricetta (NUT-008)
      description: Un alimento esterno della ricerca entra nel catalogo adesso.
      operationId: createRecipe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeInput" }
      responses:
        "201":
          description: Ricetta creata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/recipes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Una ricetta (NUT-008)
      operationId: getRecipe
      responses:
        "200":
          description: La ricetta.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    put:
      summary: Sostituisce nome, note e alimenti di una ricetta (NUT-008)
      description: I pasti già registrati con la ricetta non cambiano.
      operationId: updateRecipe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeInput" }
      responses:
        "200":
          description: Ricetta aggiornata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    delete:
      summary: Elimina una ricetta (NUT-008)
      operationId: deleteRecipe
      responses:
        "204": { description: Eliminata. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/foods:
    get:
      summary: Alimenti personali, per nome (NUT-006)
      operationId: listCustomFoods
      responses:
        "200":
          description: Gli alimenti con `source` custom.
          content:
            application/json:
              schema:
                type: object
                required: [foods]
                properties:
                  foods:
                    type: array
                    items: { $ref: "#/components/schemas/Food" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    post:
      summary: Crea un alimento personale (NUT-006)
      description: Valori per 100 g. Marca, codice a barre, porzione e caffeina facoltativi; una stringa vuota vale null.
      operationId: createCustomFood
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomFoodInput" }
      responses:
        "201":
          description: Alimento creato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Food" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "409":
          description: "`barcode_exists`: il codice a barre è già di un altro alimento."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/foods/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Modifica un alimento personale (NUT-006)
      description: Cambiano solo i campi mandati. I pasti già registrati tengono i valori copiati.
      operationId: updateCustomFood
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomFoodPatch" }
      responses:
        "200":
          description: Alimento aggiornato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Food" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`food_not_custom` (alimento di un'altra fonte) o `barcode_exists`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    delete:
      summary: Elimina un alimento personale (NUT-006)
      description: I pasti già registrati restano, senza collegamento all'alimento.
      operationId: deleteCustomFood
      responses:
        "204": { description: Eliminato. }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`food_not_custom`: si eliminano solo gli alimenti personali."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/foods/barcode/{code}:
    get:
      summary: Alimento da codice a barre (NUT-005)
      description: >
        Prima il catalogo locale, poi OpenFoodFacts. Un prodotto esterno ha
        `id` null ed entra nel catalogo solo quando si usa. `food` null: codice
        sconosciuto, o OpenFoodFacts giù se `unavailable` lo dice.
      operationId: findFoodByBarcode
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, pattern: "^\\d{6,14}$" } }
      responses:
        "200":
          description: L'alimento trovato, o null.
          content:
            application/json:
              schema:
                type: object
                required: [food, unavailable]
                properties:
                  food:
                    oneOf:
                      - { $ref: "#/components/schemas/Food" }
                      - { type: "null" }
                  unavailable:
                    type: array
                    items: { type: string, enum: [openfoodfacts] }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/foods/search:
    get:
      summary: Ricerca alimenti su catalogo locale, OpenFoodFacts, USDA e YAZIO (NUT-004, NUT-021)
      description: >
        Almeno 2 caratteri. Prima il catalogo locale (alimenti già usati o
        creati), poi OpenFoodFacts e USDA, poi i prodotti YAZIO venduti in
        Italia se YAZIO è collegato (con `yazioProductId`), senza doppioni
        per nome e marca.
        I risultati esterni hanno `id` null: entrano nel catalogo solo quando
        si usano. Una fonte che non risponde finisce in `unavailable`.
      operationId: searchFoods
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - name: italy
          in: query
          description: "`0` toglie il filtro Solo Italia di OpenFoodFacts, attivo di default."
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: Risultati, al massimo 30.
          content:
            application/json:
              schema:
                type: object
                required: [results, unavailable]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/Food" }
                  unavailable:
                    type: array
                    items: { type: string, enum: [openfoodfacts, usda, yazio] }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
  /nutrition/goals:
    get:
      summary: Obiettivo nutrizionale valido in un giorno e storico (NUT-015)
      operationId: getNutritionGoals
      parameters:
        - { $ref: "#/components/parameters/NutritionDate" }
      responses:
        "200":
          description: >
            `current` è l'obiettivo valido nel giorno (null se non c'è), `history`
            le righe dalla più recente. `editable` è false quando l'obiettivo
            arriva da YAZIO.
          content:
            application/json:
              schema:
                type: object
                required: [current, history, editable]
                properties:
                  current:
                    oneOf:
                      - { $ref: "#/components/schemas/NutritionGoal" }
                      - { type: "null" }
                  history:
                    type: array
                    items: { $ref: "#/components/schemas/NutritionGoal" }
                  editable: { type: boolean }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
    post:
      summary: Nuovo obiettivo manuale (solo senza YAZIO)
      description: >
        Aggiunge una riga allo storico, valida da `effectiveFrom` (di default
        oggi, Europe/Rome). I giorni precedenti tengono l'obiettivo che avevano.
      operationId: addNutritionGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kcal, protein, carbs, fat]
              properties:
                kcal: { type: number, minimum: 800, maximum: 8000 }
                protein: { type: number, minimum: 0, description: grammi }
                carbs: { type: number, minimum: 0, description: grammi }
                fat: { type: number, minimum: 0, description: grammi }
                waterMl: { type: [number, "null"], minimum: 0 }
                effectiveFrom: { type: string, format: date }
      responses:
        "201":
          description: Obiettivo salvato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NutritionGoal" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "409":
          description: "`goals_from_yazio`: l'obiettivo arriva da YAZIO e si cambia lì."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }
components:
  parameters:
    NutritionDate:
      name: date
      in: query
      description: Giorno locale Europe/Rome; di default oggi.
      schema: { type: string, format: date }
  responses:
    InvalidRequest:
      description: "`invalid_request`: richiesta non valida, il messaggio dice quale campo."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`not_found`: risorsa inesistente."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    DatabaseUnavailable:
      description: "`database_unavailable`: Postgres non raggiungibile."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Food:
      type: object
      description: Alimento, valori per 100 g. `id` null per un candidato esterno non ancora nel catalogo.
      required:
        [
          id,
          source,
          externalId,
          name,
          brand,
          barcode,
          servingSizeG,
          kcal,
          protein,
          carbs,
          fat,
          caffeineMg,
          yazioProductId,
        ]
      properties:
        id: { type: [string, "null"], format: uuid }
        source: { type: string, enum: [custom, openfoodfacts, usda, yazio] }
        externalId: { type: [string, "null"] }
        name: { type: string }
        brand: { type: [string, "null"] }
        barcode: { type: [string, "null"] }
        servingSizeG: { type: [number, "null"] }
        kcal: { type: number }
        protein: { type: number }
        carbs: { type: number }
        fat: { type: number }
        caffeineMg: { type: [number, "null"] }
        yazioProductId: { type: [string, "null"] }
    CustomFoodInput:
      type: object
      description: Alimento personale, valori per 100 g.
      required: [name, kcal, protein, carbs, fat]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        brand: { type: [string, "null"], maxLength: 200 }
        barcode: { type: [string, "null"], pattern: "^\\d{6,14}$" }
        servingSizeG: { type: [number, "null"], minimum: 0, maximum: 10000 }
        kcal: { type: number, minimum: 0, maximum: 900 }
        protein: { type: number, minimum: 0, maximum: 100 }
        carbs: { type: number, minimum: 0, maximum: 100 }
        fat: { type: number, minimum: 0, maximum: 100 }
        caffeineMg: { type: [number, "null"], minimum: 0 }
    YazioLink:
      type: object
      required: [configured, state, error, lastSyncAt, syncEnabled, imported]
      properties:
        configured:
          { type: boolean, description: "false se mancano le variabili YAZIO_* nel .env del server" }
        state: { type: string, enum: [connected, disconnected, error] }
        error: { type: [string, "null"], description: Il motivo dell'errore, in italiano }
        lastSyncAt: { type: [string, "null"], format: date-time, description: Ultimo giro riuscito }
        syncEnabled: { type: boolean }
        imported:
          type: object
          description: Quello che arriva da YAZIO (NUT-024); si modifica solo nell'app YAZIO.
          required: [goal, activityKcal, weight]
          properties:
            goal:
              description: L'obiettivo di oggi, se arriva da YAZIO.
              oneOf:
                - { $ref: "#/components/schemas/NutritionGoal" }
                - { type: "null" }
            activityKcal: { type: [number, "null"], description: Energia attiva di oggi }
            weight:
              description: Il peso di riferimento, l'ultima pesata.
              oneOf:
                - type: object
                  required: [day, kg]
                  properties:
                    day: { type: string, format: date }
                    kg: { type: number }
                - { type: "null" }
    Supplement:
      type: object
      required: [id, name, dose, schedule, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        dose: { type: [string, "null"], description: Testo libero, per esempio 5 g. }
        schedule: { type: [string, "null"], description: Quando, per esempio mattina. }
        active: { type: boolean }
    SupplementInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        dose: { type: [string, "null"], maxLength: 80, description: Vuota diventa null. }
        schedule: { type: [string, "null"], maxLength: 80, description: Vuoto diventa null. }
    SupplementPatch:
      type: object
      description: I campi assenti restano com'erano.
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        dose: { type: [string, "null"], maxLength: 80 }
        schedule: { type: [string, "null"], maxLength: 80 }
        active: { type: boolean }
    CustomFoodPatch:
      type: object
      description: I campi di CustomFoodInput da cambiare, tutti facoltativi.
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        brand: { type: [string, "null"], maxLength: 200 }
        barcode: { type: [string, "null"], pattern: "^\\d{6,14}$" }
        servingSizeG: { type: [number, "null"], minimum: 0, maximum: 10000 }
        kcal: { type: number, minimum: 0, maximum: 900 }
        protein: { type: number, minimum: 0, maximum: 100 }
        carbs: { type: number, minimum: 0, maximum: 100 }
        fat: { type: number, minimum: 0, maximum: 100 }
        caffeineMg: { type: [number, "null"], minimum: 0 }
    ShoppingItem:
      type: object
      required: [id, foodId, name, grams, text, checked, source]
      properties:
        id: { type: string, format: uuid }
        foodId: { type: [string, "null"], format: uuid }
        name: { type: string }
        grams: { type: [number, "null"], description: Solo per le voci dal piano. }
        text: { type: [string, "null"], description: Quantità libera delle voci a mano. }
        checked: { type: boolean }
        source: { type: string, enum: [generated, manual] }
    ShoppingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ShoppingItem" }
    Template:
      type: object
      required: [id, name, cells, dayKcal]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        cells:
          type: array
          items:
            type: object
            required: [weekday, slot, recipeId, foodId, grams, name, kcal]
            properties:
              weekday: { type: integer, minimum: 1, maximum: 7, description: 1 è lunedì }
              slot: { $ref: "#/components/schemas/MealSlot" }
              recipeId: { type: [string, "null"], format: uuid }
              foodId: { type: [string, "null"], format: uuid }
              grams: { type: [number, "null"] }
              name: { type: string }
              kcal: { type: number }
        dayKcal:
          type: array
          minItems: 7
          maxItems: 7
          items: { type: number }
    TemplateInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        cells:
          type: array
          maxItems: 35
          description: Una voce per giorno e slot, con una ricetta o un alimento (mai entrambi).
          items:
            type: object
            required: [weekday, slot]
            properties:
              weekday: { type: integer, minimum: 1, maximum: 7 }
              slot: { $ref: "#/components/schemas/MealSlot" }
              recipeId: { type: string, format: uuid }
              foodId: { type: string, format: uuid }
              food: { type: object, description: Un risultato esterno della ricerca, entra nel catalogo. }
              grams: { $ref: "#/components/schemas/Grams" }
    Recipe:
      allOf:
        - { $ref: "#/components/schemas/Macros" }
        - type: object
          description: Kcal e macro dagli alimenti di oggi.
          required: [id, name, notes, grams, items]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            notes: { type: [string, "null"] }
            grams: { type: number, description: peso totale degli alimenti }
            items:
              type: array
              items:
                allOf:
                  - { $ref: "#/components/schemas/Macros" }
                  - type: object
                    required: [id, foodId, name, grams, missing]
                    properties:
                      id: { type: string, format: uuid }
                      foodId: { type: [string, "null"], format: uuid }
                      name: { type: string }
                      grams: { type: number }
                      missing:
                        { type: boolean, description: "L'alimento è stato eliminato: la riga non conta." }
    RecipeInput:
      type: object
      required: [name, items]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        notes: { type: [string, "null"], maxLength: 2000, description: Una stringa vuota vale null. }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            description: "`foodId` di un alimento del catalogo o `food`, un risultato esterno come in POST /nutrition/meals."
            required: [grams]
            properties:
              foodId: { type: string, format: uuid }
              food: { type: object }
              grams: { $ref: "#/components/schemas/Grams" }
    Grams:
      type: number
      exclusiveMinimum: 0
      maximum: 10000
    Macros:
      type: object
      required: [kcal, protein, carbs, fat]
      properties:
        kcal: { type: number, description: kcal intere }
        protein: { type: number, description: grammi, un decimale }
        carbs: { type: number }
        fat: { type: number }
    MealSlot:
      type: string
      enum: [breakfast, morning_snack, lunch, afternoon_snack, dinner]
    NutritionDay:
      type: object
      required:
        [
          date,
          goal,
          quota,
          totals,
          plannedKcal,
          slots,
          suggestedSlot,
          nextSlot,
          waterMl,
          caffeine,
          supplements,
        ]
      properties:
        date: { type: string, format: date }
        goal:
          oneOf:
            - type: object
              required: [kcal, protein, carbs, fat, waterMl]
              properties:
                kcal: { type: number }
                protein: { type: number }
                carbs: { type: number }
                fat: { type: number }
                waterMl: { type: [number, "null"] }
            - { type: "null" }
        quota:
          description: >
            Le kcal del giorno (NUT-016): obiettivo di base più l'energia
            attiva letta da YAZIO, al massimo +1200 kcal. null senza
            obiettivo.
          oneOf:
            - type: object
              required: [kcal, baseKcal, activityKcal]
              properties:
                kcal: { type: number }
                baseKcal: { type: number }
                activityKcal: { type: number }
            - { type: "null" }
        totals: { $ref: "#/components/schemas/Macros" }
        plannedKcal: { type: number, description: kcal pianificate e non ancora mangiate }
        slots:
          type: array
          items: { $ref: "#/components/schemas/NutritionSlot" }
        suggestedSlot:
          description: Lo slot dell'ora corrente, solo per oggi; null negli altri giorni.
          oneOf:
            - { $ref: "#/components/schemas/MealSlot" }
            - { type: "null" }
        nextSlot:
          description: >
            Solo per oggi, il prossimo pasto da segnare: dallo slot dell'ora in
            poi, il primo vuoto o pianificato. null se sono tutti segnati e
            negli altri giorni.
          oneOf:
            - { $ref: "#/components/schemas/MealSlot" }
            - { type: "null" }
        waterMl: { type: integer, minimum: 0, description: Acqua bevuta nel giorno (NUT-012). }
        caffeine:
          description: >
            Caffeina del giorno (NUT-013): le voci del contatore più gli
            alimenti registrati che ne hanno.
          type: object
          required: [totalMg, mealsMg]
          properties:
            totalMg: { type: integer, minimum: 0 }
            mealsMg: { type: integer, minimum: 0, description: La parte dai pasti. }
        supplements:
          description: >
            La checklist degli integratori (NUT-014): gli attivi più quelli
            presi quel giorno.
          type: array
          items:
            type: object
            required: [id, name, dose, schedule, taken]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              dose: { type: [string, "null"] }
              schedule: { type: [string, "null"] }
              taken: { type: boolean }
    NutritionSlot:
      type: object
      required: [slot, state, meal, planned]
      properties:
        slot: { $ref: "#/components/schemas/MealSlot" }
        state: { type: string, enum: [empty, planned, eaten, skipped] }
        meal:
          oneOf:
            - allOf:
                - { $ref: "#/components/schemas/Macros" }
                - type: object
                  required: [id, items]
                  properties:
                    id: { type: string, format: uuid }
                    items:
                      type: array
                      items: { $ref: "#/components/schemas/MealItem" }
            - { type: "null" }
        planned:
          oneOf:
            - allOf:
                - { $ref: "#/components/schemas/Macros" }
                - type: object
                  required: [id, status, recipeId, recipeName, templateName, items]
                  properties:
                    id: { type: string, format: uuid }
                    status: { type: string, enum: [planned, eaten, skipped] }
                    recipeId: { type: [string, "null"] }
                    recipeName: { type: [string, "null"] }
                    templateName: { type: [string, "null"] }
                    items:
                      type: array
                      items:
                        allOf:
                          - { $ref: "#/components/schemas/Macros" }
                          - type: object
                            required: [foodId, name, grams]
                            properties:
                              foodId: { type: [string, "null"] }
                              name: { type: string }
                              grams: { type: number }
            - { type: "null" }
    MealItem:
      description: Riga del diario, con kcal e macro copiati alla registrazione.
      allOf:
        - { $ref: "#/components/schemas/Macros" }
        - type: object
          required: [id, foodId, name, grams, origin, sync]
          properties:
            id: { type: string, format: uuid, description: anche l'id della voce in YAZIO }
            foodId: { type: [string, "null"] }
            name: { type: string }
            grams: { type: number }
            origin: { type: string, enum: [ron1nos, yazio] }
            sync: { type: string, enum: [local, pending, synced, error, unmatched] }
    NutritionGoal:
      type: object
      required: [id, source, kcal, protein, carbs, fat, waterMl, effectiveFrom]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [manual, yazio] }
        kcal: { type: number }
        protein: { type: number, description: grammi }
        carbs: { type: number, description: grammi }
        fat: { type: number, description: grammi }
        waterMl: { type: [number, "null"] }
        effectiveFrom: { type: string, format: date }
    Draft:
      type: object
      required: [id, source, status, infoHash, name, size, files]
      properties:
        id: { type: string }
        source: { type: string, enum: [file, url, magnet] }
        status:
          type: string
          enum: [ready, metadata, timeout]
          description: >
            ready: file noti. metadata: magnet in attesa dei peer. timeout: attesa
            finita senza metadati, si può chiamare retry.
        infoHash: { type: string, description: Infohash v1, o v2 troncato a 40 caratteri. }
        name: { type: string }
        size: { type: number, description: Byte totali del torrent. }
        files:
          type: array
          items: { $ref: "#/components/schemas/DraftFile" }
        metadata:
          type: object
          description: Solo per i magnet in metadata o timeout.
          required: [peers, waitedSeconds, limitSeconds]
          properties:
            peers: { type: integer }
            waitedSeconds: { type: integer }
            limitSeconds: { type: integer }
    DraftFile:
      type: object
      required: [index, path, size]
      properties:
        index: { type: integer, description: Indice del file per qBittorrent. }
        path: { type: string, description: Percorso con la cartella del torrent, separato da /. }
        size: { type: number, description: byte }
    ServerStats:
      type: object
      required: [cpu, ram, disk, uptimeSec]
      properties:
        cpu: { type: number, description: Uso totale della CPU in percentuale. }
        ram: { type: number, description: Memoria usata in percentuale, senza cache. }
        disk: { type: number, description: Spazio occupato sul disco di sistema in percentuale. }
        tempC: { type: number, description: Temperatura della CPU in °C; assente senza sensore. }
        uptimeSec: { type: integer, description: Secondi da quando il server è acceso. }
        net:
          type: object
          description: Interfacce fisiche; assente se Glances non la fornisce.
          required: [rxBps, txBps]
          properties:
            rxBps: { type: number, description: byte/s in ingresso }
            txBps: { type: number, description: byte/s in uscita }
        containers:
          type: array
          description: Solo i container in esecuzione; assente senza socket Docker.
          items: { $ref: "#/components/schemas/ContainerUsage" }
    ContainerUsage:
      type: object
      required: [name, cpu, memBytes]
      properties:
        name: { type: string }
        cpu: { type: number, description: Percentuale di un core, può superare 100. }
        memBytes: { type: number }
    Downloads:
      type: object
      required: [downloadSpeed, torrents]
      properties:
        downloadSpeed: { type: number, description: Velocità totale di download in byte/s. }
        torrents:
          type: array
          items: { $ref: "#/components/schemas/Torrent" }
    Torrent:
      type: object
      required: [hash, name, progress, state, etaSeconds, downloadSpeed, size]
      properties:
        hash: { type: string, description: Infohash. }
        name: { type: string }
        progress: { type: number, minimum: 0, maximum: 1 }
        state:
          type: string
          enum: [downloading, queued, seeding, stopped, error]
        etaSeconds:
          type: [integer, "null"]
          description: Secondi alla fine; null se non stimabile.
        downloadSpeed: { type: number, description: byte/s }
        size: { type: number, description: Byte selezionati per il download. }
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum:
            - qbittorrent_unreachable
            - qbittorrent_auth
            - invalid_torrent
            - invalid_link
            - torrent_fetch_failed
            - draft_not_found
            - duplicate
            - invalid_selection
            - insufficient_space
            - start_failed
            - glances_unreachable
            - database_unavailable
            - invalid_request
            - goals_from_yazio
            - barcode_exists
            - food_not_custom
            - plan_eaten
            - plan_empty
            - not_found
            - internal
        message: { type: string, description: Messaggio in italiano da mostrare. }
        torrent:
          type: object
          description: Solo con `duplicate`, il torrent già presente.
          properties:
            name: { type: string }
            state: { type: string, enum: [downloading, queued, seeding, stopped, error] }
        needed: { type: number, description: Solo con `insufficient_space`, byte da scaricare. }
        free: { type: number, description: Solo con `insufficient_space`, byte liberi. }
